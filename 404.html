<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 — Aqua Addons</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0a1f45, #003366);
      font-family: "Trebuchet MS", sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .glass-box {
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 40px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      animation: fadeInUp 0.6s ease;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      margin: 10px 0;
    }

    .url {
      font-family: monospace;
      color: #ffeb3b;
      word-break: break-all;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: rgba(0, 174, 255, 0.8);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: rgba(0, 174, 255, 1);
    }
  </style>
</head>
<body>
  <div class="glass-box">
    <h1>404</h1>
    <p>You don’t have any approved page here for your Aqua Player.</p>
    <p>The URL you came from was:</p>
    <p class="url" id="urlDisplay"></p>
    <p>Talk to your teacher if you think this is a mistake.</p>
    <button onclick="window.location.href='/aqua/store.html'">Back to Store</button>
  </div>

  <script>
    // Show the current URL that triggered the 404
    document.getElementById("urlDisplay").textContent = window.location.href;
  </script>
</body>
</html>
