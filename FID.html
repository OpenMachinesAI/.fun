<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tori Flight Logger (Web Serial)</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    button { font-size: 1.2rem; padding: .5rem 1rem; margin: .5rem 0; }
    #status { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Tori Flight Logger</h1>
  <button id="connect">Connect to Arduino</button>
  <button id="start" disabled>Start Sending</button>
  <div id="status">Disconnected</div>

  <script>
    let port, writer;

    document.getElementById('connect').addEventListener('click', async () => {
      try {
        // Request serial port
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        writer = port.writable.getWriter();
        document.getElementById('status').textContent = 'Serial connected';
        document.getElementById('start').disabled = false;
      } catch (err) {
        document.getElementById('status').textContent = 'Error: ' + err;
      }
    });

    document.getElementById('start').addEventListener('click', async () => {
      // On iOS/Safari you need to request permission first
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        let resp = await DeviceMotionEvent.requestPermission();
        if (resp !== 'granted') {
          document.getElementById('status').textContent = 'Motion permission denied';
          return;
        }
      }

      document.getElementById('status').textContent = 'Sending accelerometer…';
      window.addEventListener('devicemotion', sendAccel, true);
    });

    async function sendAccel(e) {
      if (!writer) return;
      let ax = e.accelerationIncludingGravity.x || 0;
      let ay = e.accelerationIncludingGravity.y || 0;
      let az = e.accelerationIncludingGravity.z || 0;
      // Format to two decimals
      let packet = `as_${ax.toFixed(2)}_${ay.toFixed(2)}_${az.toFixed(2)}\n`;
      try {
        await writer.write(new TextEncoder().encode(packet));
      } catch (err) {
        document.getElementById('status').textContent = 'Write error: ' + err;
        window.removeEventListener('devicemotion', sendAccel, true);
      }
    }
  </script>
</body>
</html>
