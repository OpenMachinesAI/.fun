<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#03242c">
<title>Aqua Addons</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%233dd5ff'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg1:#051b26;--bg2:#00272f;--glass: rgba(255,255,255,0.06);
  --glass-2:rgba(255,255,255,0.035);--muted:#a7b8c0;--accent:#3dd5ff
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial;color:#e6f8ff;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.header{padding:18px 16px}
.title{font-weight:900;font-size:28px;letter-spacing:0.4px}
.subtitle{color:var(--muted);font-size:13px;margin-top:6px}
.controls{display:flex;gap:10px;padding:12px 16px;align-items:center}
.search{flex:1;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,0.03);backdrop-filter:blur(8px);display:flex;gap:8px;align-items:center}
.search input{flex:1;background:transparent;border:0;outline:none;color:inherit;font-size:15px}
.btn{padding:10px 12px;border-radius:12px;border:0;background:transparent;color:var(--accent);font-weight:700}
.tabs{display:flex;gap:8px;padding:0 16px 12px}
.tab{flex:1;padding:10px;border-radius:12px;text-align:center;background:var(--glass-2);font-weight:700;border:1px solid rgba(255,255,255,0.02);transition:transform .22s ease, box-shadow .22s ease}
.tab.active{background:linear-gradient(90deg,var(--accent),#6fdcff);color:#012033;transform:translateY(-3px);box-shadow:0 8px 20px rgba(3,45,56,0.35)}
.pages-wrap{flex:1;padding:6px 12px 120px;overflow:hidden}
.pages{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;transition:all .18s ease}
.page{scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px}
.card{width:94%;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(2,18,22,0.5);transform:translateY(10px);opacity:0;animation:fadeUp .5s both}
.card:hover{transform:translateY(4px)}
.icon{width:120px;height:120px;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.04);box-shadow:0 8px 30px rgba(0,0,0,0.6)}
.icon img{width:100%;height:100%;object-fit:cover}
.name{font-size:20px;font-weight:800;text-align:center}
.desc{font-size:14px;color:var(--muted);text-align:center}
.install{margin-top:8px;padding:12px 18px;border-radius:12px;border:0;background:linear-gradient(90deg,var(--accent),#7be8ff);color:#012033;font-weight:800;box-shadow:0 8px 18px rgba(61,213,255,0.12);transition:transform .12s ease, filter .12s ease}
.install:active{transform:translateY(2px)}
.install.installing{animation:pulse .8s infinite}
.install.installed{filter:saturate(1.2)}
.footer{position:fixed;left:12px;right:12px;bottom:12px;padding:10px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,0.04);backdrop-filter:blur(8px)}
.count{font-weight:700}

/* Empty screen */
.empty-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;padding:20px;gap:18px}
.empty-card{width:92%;max-width:540px;padding:28px;border-radius:16px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.05);backdrop-filter:blur(12px);text-align:center;box-shadow:0 18px 50px rgba(2,18,22,0.6);} 
.empty-title{font-size:20px;font-weight:800}
.empty-body{color:var(--muted);margin-top:8px}
.empty-action{margin-top:14px;padding:12px 16px;border-radius:12px;background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--accent);font-weight:800}

/* page indicator */
.pager{position:fixed;right:16px;bottom:84px;background:rgba(0,0,0,0.3);padding:6px 10px;border-radius:999px;color:#fff;font-weight:700}

@keyframes fadeUp{from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1}}
@keyframes pulse{0%{filter:brightness(1)}50%{filter:brightness(1.2)}100%{filter:brightness(1)}}

@media(min-width:720px){ .title{font-size:32px} .icon{width:140px;height:140px} }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="title">Aqua Addons</div>
    <div class="subtitle">Approved addons only — student mode</div>
  </header>

  <div class="controls">
    <div class="search" role="search">
      <input id="search" placeholder="Search Addons, Music, Videos" />
    </div>
    <button id="refresh" class="btn">Refresh</button>
  </div>

  <div class="tabs" role="tablist">
    <button id="tab-addons" class="tab active" role="tab">Addons</button>
    <button id="tab-music" class="tab" role="tab">Music</button>
    <button id="tab-videos" class="tab" role="tab">Videos</button>
  </div>

  <main class="pages-wrap">
    <div id="pages" class="pages" aria-live="polite"></div>
    <div id="empty" class="empty-screen" hidden>
      <div class="empty-card">
        <div class="empty-title">You don't have any approved addons for your Aqua Player.</div>
        <div class="empty-body">Talk to your teacher or an administrator to get access. They can assign approved lessons and videos to your student code.</div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:12px">
          <button id="enter-code" class="empty-action">Enter code</button>
          <button id="contact-teacher" class="empty-action">Contact teacher</button>
        </div>
      </div>
    </div>
  </main>

  <div class="footer">
    <div class="count" id="installed-count">Installed: 0</div>
    <div>
      <button id="admin" class="btn">Admin</button>
    </div>
  </div>

  <div id="pager" class="pager" hidden>1 / 1</div>
</div>

<script>
/* --- Audio FX (Web Audio, tiny beeps) --- */
const AudioFX = (()=>{
  let ctx = null; let enabled = true;
  function ensure(){ if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; ctx = new AC(); } return ctx; }
  function tone(f=440, dur=0.08, type='sine', vol=0.06){ if(!enabled) return; const c = ensure(); if(!c) return; const o=c.createOscillator(); const g=c.createGain(); o.type=type; o.frequency.value=f; o.connect(g); g.connect(c.destination); g.gain.value=vol; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, c.currentTime + dur); o.stop(c.currentTime + dur); }
  const click = ()=> tone(600,0.05,'triangle',0.05);
  const page  = ()=> { tone(420,0.05,'sine',0.05); setTimeout(()=>tone(520,0.08,'sine',0.05),70); if(navigator.vibrate) navigator.vibrate(10); };
  const ok    = ()=> { tone(660,0.07,'sine',0.06); setTimeout(()=>tone(880,0.09,'square',0.05),80); };
  const err   = ()=> tone(220,0.14,'sawtooth',0.06);
  return { click, page, ok, err, ensure };
})();

/* --- Helpers and element refs --- */
function getParam(k){ try{ return new URLSearchParams(location.search).get(k); }catch(e){ return null } }
const pagesEl = document.getElementById('pages');
const emptyEl = document.getElementById('empty');
const pagerEl = document.getElementById('pager');
const installedCountEl = document.getElementById('installed-count');
const searchInput = document.getElementById('search');
const refreshBtn = document.getElementById('refresh');
const adminBtn = document.getElementById('admin');
const tabAddons = document.getElementById('tab-addons');
const tabMusic = document.getElementById('tab-music');
const tabVideos = document.getElementById('tab-videos');
const enterCodeBtn = document.getElementById('enter-code');
const contactTeacherBtn = document.getElementById('contact-teacher');

let apps = [];
let installed = new Set(JSON.parse(localStorage.getItem('installed_apps')||'[]'));
let currentCategory = 'addons';
let currentPage = 0;
let pageHeight = 0;

function saveInstalled(){ localStorage.setItem('installed_apps', JSON.stringify(Array.from(installed))); installedCountEl.textContent = 'Installed: ' + installed.size; }

/* --- APK detection --- */
function isApkLink(u){ if(!u) return false; const clean=(u.split('?')[0]||'').toLowerCase(); return clean.endsWith('.apk'); }

/* --- Safe extension extraction --- */
function guessExtensionFromUrl(u){ try{ if(!u) return 'bin'; let raw=u.split('?')[0].split('#')[0]; const last=raw.split('/').pop()||raw; const parts=last.split('.'); if(parts.length<=1) return 'bin'; let ext=parts.pop().toLowerCase(); if(/^[a-z0-9]+$/i.test(ext)) return ext; const m=ext.match(/[a-z0-9]+/i); return (m&&m[0])?m[0].toLowerCase():'bin'; }catch(e){ return 'bin'; } }

/* --- Card creation and install logic --- */
function makeCard(app, idx){
  const c = document.createElement('article'); c.className='card'; c.style.animationDelay = (idx*60)+'ms';
  const icon = document.createElement('div'); icon.className='icon';
  if(app.icon){ const img = document.createElement('img'); img.src = app.icon; img.alt = ''; icon.appendChild(img); } else { icon.textContent = (app.name||'A')[0].toUpperCase(); }
  const name = document.createElement('div'); name.className='name'; name.textContent = app.name || 'Unknown';
  const desc = document.createElement('div'); desc.className='desc'; desc.textContent = app.desc || '';
  const btn = document.createElement('button'); btn.className='install'; btn.textContent = installed.has(app.id) ? 'Installed' : 'Install';

  btn.addEventListener('click', async ()=>{
    AudioFX.click();
    if(installed.has(app.id)){
      if(confirm('Uninstall "'+(app.name||'Addon')+'"?')){ installed.delete(app.id); btn.textContent='Install'; btn.classList.remove('installed'); saveInstalled(); }
      return;
    }

    try{
      btn.disabled = true; btn.textContent = 'Downloading...'; btn.classList.add('installing');
      // APK path: open directly so Android handles the installer (no CORS fetch)
      const apkDirect = app.apk_url || (isApkLink(app.content_url) ? app.content_url : null);
      if(apkDirect){
        // open in same tab to trigger system download/installer
        window.location.href = apkDirect;
      } else if(app.content_url){
        // Non-APK media (music/video) → fetch and download as file
        const res = await fetch(app.content_url);
        if(!res.ok) throw new Error('Download failed: '+res.status);
        const blob = await res.blob();
        const ext = guessExtensionFromUrl(app.content_url);
        const filename = (app.name || 'file').replace(/[^a-z0-9\-_\.]/ig,'_') + '.' + ext;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      }
      // mark as installed and celebrate
      installed.add(app.id); btn.textContent = 'Installed'; btn.classList.remove('installing'); btn.classList.add('installed'); saveInstalled(); AudioFX.ok();
    }catch(err){ console.error('Install error', err); AudioFX.err(); alert('Download failed'); btn.disabled=false; btn.textContent='Install'; btn.classList.remove('installing'); }
  });

  c.appendChild(icon); c.appendChild(name); c.appendChild(desc); c.appendChild(btn);
  return c;
}

/* --- Pages building (2 items per page) --- */
function buildPages(list){
  pagesEl.innerHTML='';
  const groups=[]; for(let i=0;i<list.length;i+=2) groups.push(list.slice(i,i+2));
  if(groups.length===0){ emptyEl.hidden=false; pagerEl.hidden=true; return; }
  emptyEl.hidden=true; pagerEl.hidden=false;
  groups.forEach((pair,idx)=>{ const page=document.createElement('section'); page.className='page'; pair.forEach((app,i)=> page.appendChild(makeCard(app, i))); if(pair.length===1){ const spacer=document.createElement('div'); spacer.style.height='18px'; page.appendChild(spacer); } pagesEl.appendChild(page); });
  setTimeout(adjustPageHeights,40); updatePager();
}

function adjustPageHeights(){ const headerH=document.querySelector('.header').offsetHeight||0; const controlsH=document.querySelector('.controls').offsetHeight||0; const footerH=document.querySelector('.footer').offsetHeight||0; const available = window.innerHeight - headerH - controlsH - footerH - 36; pageHeight = Math.max(240, available); document.querySelectorAll('.page').forEach(p=>{ p.style.minHeight=pageHeight+'px'; p.style.maxHeight=pageHeight+'px'; }); }

function render(filter=''){ const f=(filter||'').trim().toLowerCase(); const filtered = apps.filter(a=> ((a.category||'addons').toLowerCase()===currentCategory) && ((a.name||'').toLowerCase().includes(f) || (a.desc||'').toLowerCase().includes(f))); buildPages(filtered); }

function updatePager(){ const pages=document.querySelectorAll('.page'); const total=pages.length||1; pagerEl.textContent=(currentPage+1)+' / '+total; pagerEl.hidden = total<=1; }

/* --- Loading logic: base64 JSON, full URL, or short code --- */
async function loadData(param){ if(!param) return showDemo(); try{ const decoded=atob(param); if(decoded && (decoded.trim().startsWith('[') || decoded.trim().startsWith('{'))){ const parsed=JSON.parse(decoded); apps=Array.isArray(parsed)?parsed:[parsed]; render(searchInput.value); return; } }catch(e){} if(param.startsWith('http://') || param.startsWith('https://') || param.startsWith('//')){ await fetchAndLoad(param); return; } if(/^[a-z0-9_-]+$/i.test(param)){ const url='https://www.centralschool.fun/kids/'+encodeURIComponent(param)+'.json'; await fetchAndLoad(url); return; } await fetchAndLoad(param); }

async function fetchAndLoad(url){ try{ const res=await fetch(url,{cache:'no-store'}); if(!res.ok) throw new Error('HTTP '+res.status); const data=await res.json(); if(!Array.isArray(data)) throw new Error('JSON must be an array'); apps=data; render(searchInput.value); }catch(err){ console.warn('Load failed:',err); showDemo(); } }

function showDemo(){ apps=[]; render(''); }

/* --- UI wiring --- */
searchInput.addEventListener('input', ()=> render(searchInput.value));
refreshBtn.addEventListener('click', ()=> { AudioFX.click(); init(true); });
[tabAddons,tabMusic,tabVideos].forEach((btn,idx)=> btn.addEventListener('click', ()=>{ AudioFX.click(); currentCategory = idx===0?'addons':idx===1?'music':'videos'; tabAddons.classList.toggle('active', idx===0); tabMusic.classList.toggle('active', idx===1); tabVideos.classList.toggle('active', idx===2); render(searchInput.value); currentPage=0; goToPage(0); }));

enterCodeBtn.addEventListener('click', ()=>{ AudioFX.click(); const code=prompt('Enter your student code (e.g. kid123)'); if(code){ loadData(code.trim()); }});
contactTeacherBtn.addEventListener('click', ()=>{ AudioFX.click(); const teacherEmail='teacher@centralschool.fun'; location.href='mailto:'+teacherEmail+'?subject=Access%20for%20Aqua%20Addons&body=Hi%20teacher%2C%0A%0AI%20need%20my%20student%20code%20added%20to%20the%20Aqua%20Addons%20list.%20My%20code%20is%20%3Cyour%20code%3E.%0A%0AThanks.'; });

let adminTimer; adminBtn.addEventListener('touchstart', ()=>{ adminTimer=setTimeout(()=>{ if(confirm('Clear installed addons?')){ installed=new Set(); saveInstalled(); render(searchInput.value); } },1200)});
adminBtn.addEventListener('touchend', ()=> clearTimeout(adminTimer));
adminBtn.addEventListener('click', ()=>{ AudioFX.click(); if(confirm('Re-download allowed JSON?')) init(true); });

/* --- Paging: one page per swipe/wheel, with sound --- */
let isAnimating=false; function goToPage(index){ const pages=document.querySelectorAll('.page'); if(!pages.length) return; index=Math.max(0,Math.min(index,pages.length-1)); currentPage=index; isAnimating=true; pagesEl.scrollTo({top:pages[index].offsetTop,behavior:'smooth'}); setTimeout(()=>{ isAnimating=false; updatePager(); },520); AudioFX.page(); }
let startY=0,startTime=0; pagesEl.addEventListener('pointerdown',(e)=>{ startY=e.clientY; startTime=Date.now(); pagesEl.setPointerCapture(e.pointerId); }); pagesEl.addEventListener('pointerup',(e)=>{ pagesEl.releasePointerCapture(e.pointerId); const dy=e.clientY-startY, dt=Date.now()-startTime; if(Math.abs(dy)>40||dt<200){ if(dy<0) goToPage(currentPage+1); else goToPage(currentPage-1); } else snapNearest(); });
let wheelTimeout=null; pagesEl.addEventListener('wheel',(e)=>{ if(isAnimating) return e.preventDefault(); e.preventDefault(); if(wheelTimeout) return; if(e.deltaY>8) goToPage(currentPage+1); else if(e.deltaY<-8) goToPage(currentPage-1); wheelTimeout=setTimeout(()=>wheelTimeout=null,300); },{passive:false});
let scrollEndTimer; pagesEl.addEventListener('scroll', ()=>{ clearTimeout(scrollEndTimer); scrollEndTimer=setTimeout(()=>{ snapNearest(); },120); });
function snapNearest(){ const pages=document.querySelectorAll('.page'); if(!pages.length) return; const st=pagesEl.scrollTop; let closest=0,dist=Infinity; pages.forEach((p,i)=>{ const d=Math.abs(p.offsetTop-st); if(d<dist){ dist=d; closest=i; } }); goToPage(closest); }
pagesEl.addEventListener('scroll', ()=>{ document.querySelectorAll('.page').forEach((p,i)=>{ if(Math.abs(p.offsetTop-pagesEl.scrollTop)<10) currentPage=i; }); updatePager(); });

/* --- Persisted installs state to UI --- */
saveInstalled();

/* --- Init: read ?kid_allowed= or ?code= --- */
async function init(force=false){ const param=getParam('kid_allowed')||getParam('code'); if(param){ await loadData(param); } else { showDemo(); } }
window.addEventListener('resize', adjustPageHeights);
init();

/* --- PWA helpers: try blob SW (fallback to /sw.js if present) --- */
(function makePWA(){
  if('serviceWorker' in navigator){
    const swLines = [
      "self.addEventListener('install', function(event){",
      "  self.skipWaiting();",
      "  event.waitUntil(caches.open('aqua-addons-v1').then(function(c){ return c.addAll([]); }));",
      "});",
      "self.addEventListener('activate', function(event){ event.waitUntil(self.clients.claim()); });",
      "self.addEventListener('fetch', function(event){",
      "  var req = event.request; if(req.method !== 'GET') return;",
      "  event.respondWith(caches.match(req).then(function(r){",
      "    if(r) return r;",
      "    return fetch(req).then(function(res){",
      "      try{ var copy = res.clone(); caches.open('aqua-addons-v1').then(function(c){ c.put(req, copy); }); }catch(e){}",
      "      return res;",
      "    });",
      "  }).catch(function(){ return caches.match('/'); }));",
      "});"
    ];
    try{ const swCode=swLines.join('\n'); const swBlob=new Blob([swCode],{type:'application/javascript'}); const swUrl=URL.createObjectURL(swBlob); navigator.serviceWorker.register(swUrl).catch(()=> navigator.serviceWorker.register('/sw.js')); }catch(err){ console.warn('SW register failed',err); }
  }
})();
</script>
</body>
</html>
