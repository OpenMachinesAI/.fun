<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Mouse Battle</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0f1a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #e9f3ff;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .frame {
      border: 2px solid #6bc1ff;
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      width: min(1200px, 98vw);
      height: min(720px, 92vh);
      overflow: hidden;
      background: #02040a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="frame">
    <iframe
      src="https://yoplay.io/crazy-mouse-battle.embed"
      title="Crazy Mouse Battle"
      allowfullscreen
      scrolling="no"
      loading="lazy">
    </iframe>
  </div>

</html>
