<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>EagleGC — Binary + Handshake + Ping</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#0e1020; --panel:#151936; --border:#2a2f65; --ink:#e6e9ff;
      --accent:#2430a3; --accent2:#3a49e0;
      --good:#05e676; --warn:#ffb020; --bad:#ff3b3b;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui}
    .wrap{max-width:1400px;margin:20px auto;padding:0 16px}
    h1{margin:0 0 12px;font-size:22px}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 12px 30px #0006}
    button{background:var(--accent);color:#fff;border:1px solid var(--accent2);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px}
    .ok{background:var(--good)} .warn{background:var(--warn)} .bad{background:var(--bad)}
    .pill{background:#0b0f2a;border:1px solid var(--border);border-radius:10px;padding:6px 10px;min-width:110px;text-align:center}
    .log{height:200px;background:#0b0f2a;border:1px solid var(--border);border-radius:10px;padding:8px;overflow:auto;font-family:ui-monospace,Consolas,Menlo,monospace;font-size:13px}
    #main3d{width:100%;height:380px;display:block;background:#000;border-radius:12px}
    input{background:#0b0f2a;border:1px solid var(--border);border-radius:10px;color:var(--ink);padding:10px 12px}
    .cmdRow input{width:120px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@6.42.0/babylon.js"></script>
</head>
<body>
<div class="wrap">
  <h1>EagleGC — Binary Ground Control</h1>

  <div class="row">
    <button id="connectBtn">Connect Ground Micro:bit</button>
    <button id="disconnectBtn" disabled>Disconnect</button>

    <div class="row">
      <div><span id="linkDot" class="dot bad"></span>Link</div>
      <div class="pill">PPS: <span id="ppsVal">0</span></div>
      <div class="pill">RTT: <span id="rttVal">--</span> ms</div>
      <div class="pill">Session: <span id="sessVal">--</span></div>
    </div>
  </div>

  <div class="row" style="margin-top:10px">
    <button id="helloBtn" disabled>New Handshake</button>
    <div class="cmdRow row">
      <strong>CMD</strong>
      <input id="cmdId" type="number" min="0" max="255" value="2">
      <input id="cmdVal" type="number" min="0" max="255" value="3">
      <button id="sendCmd" disabled>Send CMD</button>
      <span class="pill" title="PC->Ground commands are newline text because micro:bit v1 serial input is text-oriented.">
        PC→Ground: text
      </span>
    </div>
  </div>

  <div class="card" style="margin-top:14px"><canvas id="main3d"></canvas></div>

  <div class="card" style="margin-top:14px">
    <h3 style="margin:0 0 10px">Raw / Events</h3>
    <div id="log" class="log"></div>
  </div>
</div>

<script>
/* =================== Protocol =================== */
const PKT_TEL   = 0x01; // 11 bytes
const PKT_HELLO = 0x02; // 2 bytes
const PKT_ACK   = 0x03; // 2 bytes
const PKT_PING  = 0x04; // 3 bytes
const PKT_PONG  = 0x05; // 3 bytes
const PKT_CMD   = 0x06; // 4 bytes

function pktLen(t){
  if(t===PKT_TEL) return 11;
  if(t===PKT_HELLO) return 2;
  if(t===PKT_ACK) return 2;
  if(t===PKT_PING) return 3;
  if(t===PKT_PONG) return 3;
  if(t===PKT_CMD) return 4;
  return -1;
}

/* =================== UI =================== */
const logEl = document.getElementById('log');
function log(s){ const d=document.createElement('div'); d.textContent=s; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }

const linkDot = document.getElementById('linkDot');
const ppsVal = document.getElementById('ppsVal');
const rttVal = document.getElementById('rttVal');
const sessVal = document.getElementById('sessVal');

const connectBtn = document.getElementById('connectBtn');
const disconnectBtn = document.getElementById('disconnectBtn');
const helloBtn = document.getElementById('helloBtn');
const sendCmdBtn = document.getElementById('sendCmd');
const cmdIdEl = document.getElementById('cmdId');
const cmdValEl = document.getElementById('cmdVal');

/* =================== Serial =================== */
let port=null, reader=null, writer=null;
let rxBuf = new Uint8Array(0);

/* =================== Link/Stats =================== */
let lastAnyPacketMs = 0;
let ppsCount = 0;
let currentSession = null;

// RTT computed from PING->PONG using pingSeq
const pingSentAt = new Map(); // seq -> performance.now()
let lastRtt = null;

// PPS timer
setInterval(()=>{
  ppsVal.textContent = ppsCount;
  ppsCount = 0;

  const alive = (performance.now() - lastAnyPacketMs) < 1500;
  linkDot.className = 'dot ' + (alive ? 'ok' : 'bad');

  rttVal.textContent = (lastRtt==null) ? '--' : Math.round(lastRtt);
}, 1000);

/* =================== Decode helpers =================== */
function u8(a,i){ return a[i] }
function i8(a,i){ let v=a[i]; return v>127 ? v-256 : v }
function i16le(a,i){
  const lo=a[i], hi=a[i+1];
  let v = (hi<<8) | lo;
  return v>32767 ? v-65536 : v;
}

/* =================== Packet Handlers =================== */
function handlePacket(pkt){
  lastAnyPacketMs = performance.now();
  ppsCount++;

  const t = pkt[0];

  if(t === PKT_HELLO){
    const s = pkt[1];
    currentSession = s;
    sessVal.textContent = s;
    log(`HELLO session=${s}`);
    return;
  }

  if(t === PKT_ACK){
    const s = pkt[1];
    currentSession = s;
    sessVal.textContent = s;
    log(`ACK session=${s} ✅ handshake complete`);
    return;
  }

  if(t === PKT_PING){
    const s = pkt[1], seq = pkt[2];
    currentSession = s;
    sessVal.textContent = s;
    pingSentAt.set(seq, performance.now());
    // Keep map from growing
    if(pingSentAt.size > 32){
      const firstKey = pingSentAt.keys().next().value;
      pingSentAt.delete(firstKey);
    }
    log(`PING s=${s} seq=${seq}`);
    return;
  }

  if(t === PKT_PONG){
    const s = pkt[1], seq = pkt[2];
    currentSession = s;
    sessVal.textContent = s;
    const t0 = pingSentAt.get(seq);
    if(t0 != null){
      lastRtt = performance.now() - t0;
      pingSentAt.delete(seq);
    }
    log(`PONG s=${s} seq=${seq}` + (lastRtt!=null ? ` rtt≈${Math.round(lastRtt)}ms` : ''));
    return;
  }

  if(t === PKT_CMD){
    const s=pkt[1], cmd=pkt[2], val=pkt[3];
    currentSession = s;
    sessVal.textContent = s;
    log(`CMD sent s=${s} cmd=${cmd} val=${val}`);
    return;
  }

  if(t === PKT_TEL){
    const s = pkt[1];
    const seq = pkt[2];
    const ax = i16le(pkt,3);
    const ay = i16le(pkt,5);
    const az = i16le(pkt,7);
    const temp = i8(pkt,9);
    const status = u8(pkt,10);

    currentSession = s;
    sessVal.textContent = s;

    // derive pitch/roll for display / 3D
    const G = 1024;
    const pitch = Math.atan2(ax, Math.sqrt(ay*ay + az*az)) * 180/Math.PI;
    const roll  = Math.atan2(ay, az) * 180/Math.PI;

    // Update 3D
    apply3D(pitch, roll, az, status);

    // Keep raw log light (don’t spam every 25Hz forever)
    if(seq % 10 === 0){
      log(`TEL s=${s} #${seq} ax=${ax} ay=${ay} az=${az} temp=${temp} status=0x${status.toString(16).padStart(2,'0')}`);
    }
    return;
  }

  // Unknown packet
  log(`?? type=0x${t.toString(16)} len=${pkt.length}`);
}

/* =================== Stream Parser =================== */
function appendBytes(chunk){
  const tmp = new Uint8Array(rxBuf.length + chunk.length);
  tmp.set(rxBuf,0);
  tmp.set(chunk,rxBuf.length);
  rxBuf = tmp;

  while(rxBuf.length >= 1){
    const t = rxBuf[0];
    const L = pktLen(t);
    if(L < 0){
      // desync: drop one byte
      rxBuf = rxBuf.slice(1);
      continue;
    }
    if(rxBuf.length < L) return; // wait for more
    const pkt = rxBuf.slice(0,L);
    rxBuf = rxBuf.slice(L);
    handlePacket(pkt);
  }
}

/* =================== WebSerial =================== */
async function readLoop(){
  while(port && reader){
    const {value, done} = await reader.read();
    if(done) break;
    if(value) appendBytes(value);
  }
}

async function sendTextLine(line){
  if(!writer) return;
  const enc = new TextEncoder();
  await writer.write(enc.encode(line.endsWith('\n') ? line : (line+'\n')));
}

/* =================== Controls =================== */
connectBtn.onclick = async ()=>{
  try{
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    reader = port.readable.getReader();
    writer = port.writable.getWriter();

    connectBtn.disabled = true;
    disconnectBtn.disabled = false;
    helloBtn.disabled = false;
    sendCmdBtn.disabled = false;

    log('Connected.');
    readLoop();
  }catch(e){
    log('Connect error: ' + e.message);
  }
};

disconnectBtn.onclick = async ()=>{
  try{
    if(reader){ await reader.cancel(); reader.releaseLock(); }
    if(writer){ writer.releaseLock(); }
    if(port){ await port.close(); }
  }catch{}
  port=null; reader=null; writer=null;
  connectBtn.disabled=false;
  disconnectBtn.disabled=true;
  helloBtn.disabled=true;
  sendCmdBtn.disabled=true;
  log('Disconnected.');
};

helloBtn.onclick = async ()=>{
  // This triggers the ground micro:bit to generate a new session + handshake
  await sendTextLine('HELLO');
  log('TX: HELLO (request new handshake)');
};

sendCmdBtn.onclick = async ()=>{
  const cmd = Math.max(0, Math.min(255, Math.round(+cmdIdEl.value || 0)));
  const val = Math.max(0, Math.min(255, Math.round(+cmdValEl.value || 0)));
  await sendTextLine(`CMD=${cmd},VAL=${val}`);
  log(`TX: CMD=${cmd},VAL=${val}`);
};

/* =================== Babylon Rocket (compact) =================== */
const canvas = document.getElementById('main3d');
const engine = new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,antialias:true});
const scene  = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0,0,0,1);

const cam = new BABYLON.ArcRotateCamera("cam", Math.PI/6, Math.PI/3, 10, BABYLON.Vector3.Zero(), scene);
cam.inputs.clear();

const red = new BABYLON.StandardMaterial("red", scene);
red.emissiveColor = new BABYLON.Color3(1,0.1,0.1);
red.disableLighting = true;

const blue = new BABYLON.StandardMaterial("blue", scene);
blue.emissiveColor = new BABYLON.Color3(0.2,0.6,1);
blue.disableLighting = true;

const rocket = new BABYLON.TransformNode("rocket", scene);
const body = BABYLON.MeshBuilder.CreateCylinder("body",{height:4.5,diameter:0.8,tessellation:64},scene);
body.material = red; body.parent = rocket;

const nose = BABYLON.MeshBuilder.CreateCylinder("nose",{height:1.2,diameterTop:0.05,diameterBottom:0.8,tessellation:64},scene);
nose.material = red; nose.parent = rocket; nose.position.y = 2.85;

for(let i=0;i<4;i++){
  const fin = BABYLON.MeshBuilder.CreateBox("fin"+i,{width:0.7,height:0.9,depth:0.22},scene);
  fin.material = blue; fin.parent = rocket;
  const a=i*Math.PI/2, r=0.52;
  fin.position.set(Math.cos(a)*r, -2 + 0.45, Math.sin(a)*r);
  fin.rotation.y = a;
}

engine.runRenderLoop(()=>scene.render());
new ResizeObserver(()=>engine.resize()).observe(canvas);

// Apply pitch/roll + a tiny “status breathing”
function apply3D(pitchDeg, rollDeg, az, status){
  rocket.rotation.x = pitchDeg*Math.PI/180;
  rocket.rotation.z = rollDeg*Math.PI/180;

  // status bit1 (recent ping) adds slight glow scale
  const pingOk = (status & 0x02) !== 0;
  const s = pingOk ? 1.02 : 1.0;
  rocket.scaling.set(s,s,s);
}
</script>
</body>
</html>
