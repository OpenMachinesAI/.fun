<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>CentralSchool.fun — PRO GAMER DEN</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#0e1b2a;
      --muted:#5f7288;
      --accent:#3aa8ff;
      --accent2:#7ad6ff;
      --pink:#ff6fd8;
      --lime:#52ffb8;

      --glass: rgba(255,255,255,.72);
      --glass2: rgba(255,255,255,.52);
      --border: rgba(0,0,0,.08);
      --shadow: 0 18px 50px rgba(0,0,0,.18);

      --font-head:"Press Start 2P", cursive;
      --font-body:"VT323", monospace;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);

      /* Wii cursor */
      --wii-cursor: url("https://www.centralschool.fun/cursor.svg");

      /* Prototype GIF textures — replace later */
      --gif-bg: url("https://media.tenor.com/1y3bZg2oYJcAAAAC/space-stars.gif");
      --gif-bubbles: url("https://media.tenor.com/7g3kqGkQmH4AAAAC/pixel-art.gif");
      --gif-header: url("https://media.tenor.com/3K6kzqf4d8YAAAAC/music-equalizer.gif");
      --gif-card: url("https://media.tenor.com/0dR1g2m8ZqkAAAAC/polaroid-photo.gif");
      --gif-click: url("https://media.tenor.com/5o1p2t7jYpQAAAAC/play-button.gif");
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    /* Apply Wii cursor everywhere */
    body, button, a, input, textarea, select, label {
      cursor: var(--wii-cursor) 12 12, auto;
    }

    body{
      margin:0;
      color:var(--ink);
      font-family:var(--font-body);
      font-size:20px;

      background:
        radial-gradient(1200px 600px at 50% -200px, #ffffff 20%, transparent 70%),
        radial-gradient(800px 420px at 10% 10%, rgba(58,168,255,.18), transparent 65%),
        radial-gradient(700px 420px at 90% 20%, rgba(255,111,216,.14), transparent 70%),
        radial-gradient(700px 520px at 40% 100%, rgba(122,214,255,.20), transparent 70%),
        linear-gradient(180deg, #f7fbff, #eaf3ff);

      overflow-x:hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* GIF shimmer background */
    body::before{
      content:"";
      position:fixed; inset:0;
      background: var(--gif-bg) center/cover no-repeat;
      opacity:.06;
      filter: blur(2px) saturate(1.15);
      pointer-events:none;
      z-index:-3;
    }

    /* Soft scanlines */
    body::after{
      content:"";
      position:fixed; inset:0;
      pointer-events:none;
      z-index:-1;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,.015),
        rgba(0,0,0,.015) 1px,
        transparent 1px,
        transparent 5px
      );
      opacity:.18;
    }

    /* Floating bubbles layer */
    .bubbles{
      position:fixed; inset:0;
      pointer-events:none;
      z-index:-2;
      overflow:hidden;
    }
    .bubble{
      position:absolute;
      width: clamp(16px, 2.8vw, 44px);
      height: clamp(16px, 2.8vw, 44px);
      border-radius:999px;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.90), rgba(255,255,255,.10) 55%, rgba(58,168,255,.10) 70%, rgba(58,168,255,.05));
      border: 1px solid rgba(58,168,255,.22);
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
      opacity:.85;
      transform: translateY(110vh);
      animation: floatUp linear infinite;
    }
    .bubble::after{
      content:"";
      position:absolute; inset:-8px;
      background: var(--gif-bubbles) center/cover no-repeat;
      opacity:.06;
      border-radius:999px;
      filter: blur(1px);
      mix-blend-mode: screen;
    }
    @keyframes floatUp{
      0%{ transform: translateY(110vh) translateX(0) scale(.9); opacity:0; }
      10%{ opacity:.85; }
      50%{ transform: translateY(40vh) translateX(18px) scale(1); }
      100%{ transform: translateY(-20vh) translateX(-18px) scale(1.08); opacity:0; }
    }

    header{
      position:sticky;
      top:0;
      z-index:100;
      padding: 14px 14px 0;
    }

    .bar{
      display:flex;
      align-items:center;
      gap:16px;
      padding: calc(14px + var(--safe-top)) calc(16px + var(--safe-right)) 14px calc(16px + var(--safe-left));
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.55)),
        var(--gif-header) center/cover no-repeat;
      background-blend-mode: screen;
      border:1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      position:relative;
      overflow:hidden;
    }
    .bar::before{
      content:"";
      position:absolute; inset:-60px;
      background:
        radial-gradient(420px 220px at 20% 10%, rgba(58,168,255,.22), transparent 70%),
        radial-gradient(420px 260px at 80% 40%, rgba(255,111,216,.18), transparent 70%);
      opacity:.9;
      pointer-events:none;
      animation: headerFloat 9s ease-in-out infinite;
    }
    @keyframes headerFloat{
      0%,100%{ transform: translateY(0px); }
      50%{ transform: translateY(10px); }
    }

    .mark{
      width:64px;
      height:64px;
      border-radius: 18px;
      background: rgba(255,255,255,.70);
      border:1px solid rgba(0,0,0,.08);
      box-shadow: 0 14px 30px rgba(0,0,0,.14);
      position:relative;
      overflow:hidden;
      flex:0 0 auto;
      animation: bob 3.2s ease-in-out infinite;
    }
    @keyframes bob{
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-4px); }
    }
    .mark::before{
      content:"";
      position:absolute; inset:-10px;
      background: var(--gif-bubbles) center/cover no-repeat;
      opacity:.10;
      mix-blend-mode: screen;
    }
    .mark svg{ position:absolute; inset:0; opacity:.92; filter: drop-shadow(0 10px 18px rgba(0,0,0,.18)); }

    h1{
      margin:0;
      font-family:var(--font-head);
      font-size: 1.15rem;
      color: rgba(0,0,0,.70);
      text-transform:uppercase;
      line-height:1.4;
      text-shadow: 0 2px 0 rgba(255,255,255,.65);
    }

    .sub{
      margin-top:6px;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 6px 12px;
      border-radius: 999px;
      border:1px solid rgba(0,0,0,.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.62)),
        var(--gif-card) center/cover no-repeat;
      background-blend-mode: screen;
      color: rgba(0,0,0,.55);
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      box-shadow: 0 12px 22px rgba(0,0,0,.12);
      backdrop-filter: blur(8px);
      animation: pop 1.9s ease-in-out infinite;
    }
    .sub::before{
      content:"";
      width:10px;height:10px;border-radius:999px;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(58,168,255,.16);
      animation: ping 1.2s ease-in-out infinite;
    }
    @keyframes ping{
      0%,100%{ transform: scale(.9); opacity:.9; }
      50%{ transform: scale(1.15); opacity:1; }
    }
    @keyframes pop{
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-2px); }
    }

    .app-controls{
      margin-left:auto;
      display:flex;
      gap:10px;
      align-items:center;
      position:relative;
      z-index:2;
    }

    .app-btn{
      border:1px solid rgba(0,0,0,.10);
      background:
        linear-gradient(180deg, rgba(255,255,255,.90), rgba(255,255,255,.65)),
        var(--gif-bubbles) center/cover no-repeat;
      background-blend-mode: screen;
      padding:10px 14px;
      border-radius: 999px;
      font-family:var(--font-body);
      font-size:1.15rem;
      cursor: var(--wii-cursor) 12 12, pointer;
      color: rgba(0,0,0,.70);
      white-space:nowrap;
      touch-action:manipulation;
      box-shadow: 0 14px 26px rgba(0,0,0,.14);
      transition: transform 160ms ease, box-shadow 160ms ease;
      position:relative;
      overflow:hidden;
    }
    .app-btn:hover{ transform: translateY(-2px) scale(1.02); box-shadow: 0 18px 34px rgba(0,0,0,.18); }
    .app-btn:active{ transform: translateY(0) scale(.99); }

    .app-btn.close{
      font-weight:900;
      border-color: rgba(255,111,216,.35);
      background:
        linear-gradient(180deg, rgba(255,255,255,.90), rgba(255,255,255,.65)),
        var(--gif-click) center/cover no-repeat;
      background-blend-mode: screen;
    }

    .ribbon{
      margin-top: 12px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.40)),
        url("https://media.tenor.com/7q7hYF1bJ9kAAAAC/weather-rain.gif") center/cover no-repeat;
      background-blend-mode: screen;
      border:1px solid rgba(0,0,0,.08);
      box-shadow: 0 14px 34px rgba(0,0,0,.14);
      backdrop-filter: blur(10px);
      overflow:hidden;
      padding:10px 0;
      position:relative;
    }
    .ribbon span{
      display:inline-block;
      white-space:nowrap;
      padding-left:100%;
      animation: marquee 14s linear infinite;
      font-weight:900;
      letter-spacing:.12em;
      color: rgba(0,0,0,.55);
      text-transform:uppercase;
    }
    @keyframes marquee{ 0%{transform:translateX(0);} 100%{transform:translateX(-100%);} }

    main{
      padding:24px;
      max-width:1100px;
      margin:0 auto;
      position:relative;
      z-index:2;
      padding-bottom: calc(24px + var(--safe-bottom));
    }

    .intro{
      background:
        linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.52)),
        var(--gif-card) center/cover no-repeat;
      background-blend-mode: screen;
      border:1px solid rgba(0,0,0,.08);
      padding:16px 16px 14px;
      margin-bottom:24px;
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      position:relative;
      overflow:hidden;
    }
    .intro::before{
      content:"";
      position:absolute; inset:-40px;
      background:
        radial-gradient(420px 220px at 10% 20%, rgba(58,168,255,.22), transparent 70%),
        radial-gradient(420px 240px at 90% 50%, rgba(255,111,216,.14), transparent 70%);
      opacity:.9;
      pointer-events:none;
      animation: headerFloat 9s ease-in-out infinite;
    }
    .intro p{
      position:relative;
      color: rgba(0,0,0,.72);
      margin:0;
      font-size:1.2rem;
      line-height:1.35;
      font-weight:900;
      letter-spacing:.02em;
    }
    .intro p + p{ margin-top:6px; }

    .ads{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
      gap:16px;
      margin-bottom:30px;
    }
    .ad{
      border-radius: 22px;
      padding:14px;
      text-align:center;
      line-height:1.6;
      font-family:var(--font-head);
      font-size:0.75rem;
      color: rgba(0,0,0,.65);
      border:1px solid rgba(0,0,0,.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.52)),
        url("https://media.tenor.com/zzsK2Y1u9eYAAAAC/news-breaking-news.gif") center/cover no-repeat;
      background-blend-mode: screen;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      animation: floatCard 3.2s ease-in-out infinite;
      position:relative;
      overflow:hidden;
    }
    .ad:nth-child(2){ animation-delay:.2s; }
    .ad:nth-child(3){ animation-delay:.4s; }
    .ad:nth-child(4){ animation-delay:.6s; }

    @keyframes floatCard{
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-6px); }
    }

    .board{
      display:grid;
      gap:18px;
      grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
      margin-bottom:30px;
    }

    /* Ripple-on-click effect */
    .ripple{
      position:absolute;
      border-radius:999px;
      transform: translate(-50%,-50%);
      pointer-events:none;
      width:20px; height:20px;
      background: rgba(58,168,255,.25);
      box-shadow: 0 0 0 8px rgba(58,168,255,.10);
      animation: rippleOut 560ms ease-out forwards;
      mix-blend-mode: multiply;
      z-index:5;
    }
    @keyframes rippleOut{
      0%{ opacity:0; transform: translate(-50%,-50%) scale(.4); }
      20%{ opacity:1; }
      100%{ opacity:0; transform: translate(-50%,-50%) scale(11); }
    }

    .ticket{
      position:relative;
      border-radius: 22px;
      padding: 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      cursor: var(--wii-cursor) 12 12, pointer;
      text-align:left;
      overflow:hidden;
      text-decoration:none;
      border:1px solid rgba(0,0,0,.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,.84), rgba(255,255,255,.56)),
        var(--gif-card) center/cover no-repeat;
      background-blend-mode: screen;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      transform: translateZ(0);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }
    .ticket::before{
      content:"";
      position:absolute; inset:-40px;
      background:
        radial-gradient(420px 220px at 15% 20%, rgba(58,168,255,.22), transparent 70%),
        radial-gradient(420px 260px at 85% 60%, rgba(255,111,216,.14), transparent 70%);
      opacity:.8;
      pointer-events:none;
      animation: headerFloat 9s ease-in-out infinite;
    }
    .ticket:hover{
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(58,168,255,.35);
      box-shadow: 0 22px 60px rgba(0,0,0,.22);
    }
    .ticket:active{ transform: translateY(0) scale(.99); }

    .ticket .tt{
      position:relative;
      border-radius: 16px;
      padding: 12px;
      display:flex;
      align-items:center;
      gap:12px;
      font-family:var(--font-head);
      font-size:0.70rem;
      line-height:1.4;
      color: rgba(0,0,0,.72);
      border:1px solid rgba(0,0,0,.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.60)),
        url("https://media.tenor.com/3yG0fQWQ0m4AAAAC/youtube-logo.gif") center/cover no-repeat;
      background-blend-mode: screen;
      box-shadow: 0 12px 26px rgba(0,0,0,.14);
      backdrop-filter: blur(10px);
    }

    .ticket .icon{
      width:44px; height:44px;
      border-radius: 14px;
      border:1px solid rgba(0,0,0,.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.65)),
        url("https://media.tenor.com/4kqX5tq0g0UAAAAC/hello-hi.gif") center/cover no-repeat;
      background-blend-mode: screen;
      box-shadow: 0 12px 26px rgba(0,0,0,.14);
      display:grid;
      place-items:center;
      font-size: 22px;
      flex: 0 0 auto;
      animation: iconWiggle 3.6s ease-in-out infinite;
    }
    @keyframes iconWiggle{
      0%,100%{ transform: rotate(0deg); }
      50%{ transform: rotate(2deg); }
    }

    .ticket .desc{
      position:relative;
      color: rgba(0,0,0,.62);
      font-family:var(--font-body);
      font-size:1.12rem;
      padding: 0 6px 6px;
      font-weight:900;
      letter-spacing:.02em;
    }

    .ticket.new::after{
      content:"NEW!";
      position:absolute;
      top:12px;
      right:12px;
      padding: 8px 12px;
      border-radius: 999px;
      border:1px solid rgba(0,0,0,.10);
      background:
        linear-gradient(180deg, rgba(255,255,255,.90), rgba(255,255,255,.65)),
        url("https://media.tenor.com/2roX3p4c1sMAAAAC/game-controller.gif") center/cover no-repeat;
      background-blend-mode: screen;
      box-shadow: 0 14px 26px rgba(0,0,0,.18);
      color: rgba(0,0,0,.62);
      font-family: var(--font-head);
      font-size: 0.65rem;
      letter-spacing:.12em;
      animation: badgePop 1.2s ease-in-out infinite;
      z-index:3;
    }
    @keyframes badgePop{
      0%,100%{ transform: scale(1); }
      50%{ transform: scale(1.06); }
    }

    .board .empty{
      grid-column:1 / -1;
      text-align:center;
      padding:40px 20px;
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.50)),
        url("https://media.tenor.com/7l6H3mC3gS8AAAAC/loading-buffering.gif") center/cover no-repeat;
      background-blend-mode: screen;
      border:1px solid rgba(0,0,0,.08);
      box-shadow: var(--shadow);
      color: rgba(0,0,0,.58);
      font-family:var(--font-head);
      letter-spacing:.10em;
      backdrop-filter: blur(10px);
      animation: floatCard 3.2s ease-in-out infinite;
    }

    /* ===== Modal open/close animations (Wii-ish zoom pop) ===== */
    .backdrop{
      display:none;
      position:fixed; inset:0;
      background: rgba(6,16,30,.48);
      backdrop-filter: blur(10px);
      z-index:1990;
      opacity:0;
      transition: opacity 220ms ease;
    }
    .backdrop.show{
      display:block;
      opacity:1;
    }

    .modal{
      display:none;
      position:fixed;
      inset:5% 5%;
      background:
        linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.62)),
        var(--gif-bg) center/cover no-repeat;
      background-blend-mode: screen;
      border:1px solid rgba(0,0,0,.10);
      box-shadow: 0 26px 80px rgba(0,0,0,.35);
      z-index:2000;
      padding:10px;
      border-radius: 26px;
      resize: both;
      overflow: hidden;
      min-width: 320px;
      min-height: 260px;
      max-width: calc(100vw - 16px);
      max-height: calc(100vh - 16px);
      backdrop-filter: blur(14px);
      transform: translateY(10px) scale(.96);
      opacity:0;
      transition: transform 260ms cubic-bezier(.2,.9,.2,1), opacity 260ms ease;
      transform-origin: center;
    }
    .modal.show{
      display:flex;
      flex-direction:column;
      transform: translateY(0) scale(1);
      opacity:1;
    }

    .modal-toolbar{
      background:
        linear-gradient(180deg, rgba(255,255,255,.84), rgba(255,255,255,.60)),
        var(--gif-header) center/cover no-repeat;
      background-blend-mode: screen;
      color: rgba(0,0,0,.70);
      padding:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      border:1px solid rgba(0,0,0,.08);
      border-radius: 18px;
      box-shadow: 0 12px 26px rgba(0,0,0,.18);
    }

    .toolbar-left{ display:flex; align-items:center; gap:10px; min-width: 0; }
    .toolbar-icon{
      width:40px;height:40px;
      border-radius: 14px;
      border:1px solid rgba(0,0,0,.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.62)),
        url("https://media.tenor.com/0G9vF0v2a3gAAAAC/photography-camera.gif") center/cover no-repeat;
      background-blend-mode: screen;
      box-shadow: 0 12px 26px rgba(0,0,0,.18);
      display:grid;
      place-items:center;
      font-size: 20px;
      flex: 0 0 auto;
    }
    .toolbar-text{ display:flex; flex-direction:column; min-width:0; }
    .toolbar-title{
      font-family:var(--font-body);
      font-weight:900;
      letter-spacing:1px;
      font-size:1.2rem;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 55vw;
      color: rgba(0,0,0,.68);
    }
    .toolbar-sub{ display:none; }

    .toolbar-buttons{ display:flex; gap:8px; flex:0 0 auto; }

    .toolbar-button{
      border:1px solid rgba(0,0,0,.10);
      padding: 8px 12px;
      border-radius: 999px;
      font-family:var(--font-body);
      font-size:1.1rem;
      cursor: var(--wii-cursor) 12 12, pointer;
      color: rgba(0,0,0,.72);
      touch-action:manipulation;
      background:
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.62)),
        var(--gif-bubbles) center/cover no-repeat;
      background-blend-mode: screen;
      box-shadow: 0 12px 22px rgba(0,0,0,.16);
      transition: transform 150ms ease;
    }
    .toolbar-button:hover{ transform: translateY(-2px) scale(1.02); }
    .toolbar-button:active{ transform: translateY(0) scale(.99); }

    .modal-content{
      flex:1;
      background: rgba(255,255,255,.35);
      border:1px solid rgba(0,0,0,.10);
      border-radius: 18px;
      margin-top:10px;
      overflow:hidden;
      min-height: 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
    }
    .modal-content iframe{
      width:100%;
      height:100%;
      border:none;
      display:block;
      background:white;
    }

    footer{
      text-align:center;
      padding:22px 18px;
      border-radius: 22px;
      margin: 30px auto 24px;
      max-width:1100px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.48)),
        var(--gif-card) center/cover no-repeat;
      background-blend-mode: screen;
      border:1px solid rgba(0,0,0,.08);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    footer div{ color: rgba(0,0,0,.62); font-size:1.2rem; font-weight:900; }
    footer a{ color: var(--accent); font-weight:900; }

    /* ===== Mobile ===== */
    @media (max-width: 720px){
      body{ font-size: 18px; }
      main{ padding: 16px; }
      .bar{
        gap:12px;
        padding:calc(12px + var(--safe-top)) calc(12px + var(--safe-right)) 12px calc(12px + var(--safe-left));
      }
      h1{ font-size: 0.92rem; }

      .modal{
        inset:0;
        border:none;
        box-shadow:none;
        resize:none;
        min-width: 0;
        min-height: 0;
        max-width: none;
        max-height: none;
        border-radius: 0;
        padding: 10px;
      }
      .modal-toolbar{ padding: 10px; border-radius: 18px; }
      .toolbar-title{ max-width: 55vw; }
    }
  </style>
</head>

<body>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>

  <header>
    <div class="bar">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 120 96" preserveAspectRatio="xMidYMid slice">
          <rect x="0" y="0" width="120" height="96" fill="rgba(58,168,255,.35)" />
          <path d="M10,80 L60,20 L110,80" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="4"/>
          <rect x="50" y="50" width="20" height="20" fill="rgba(255,111,216,.55)" />
        </svg>
      </div>

      <div style="min-width:0; position:relative; z-index:2;">
        <h1>PRO GAMER DEN</h1>
        <div class="sub">Under Construction</div>
      </div>

      <div class="app-controls" style="position:relative; z-index:2;">
        <button class="app-btn close" id="exitApp" title="Close">EXIT ✖</button>
      </div>
    </div>

    <div class="ribbon" id="newGamesRibbon">
      <span>*** WELCOME TO THE ZONE *** INSERT COIN *** LOADING...</span>
    </div>
  </header>

  <main>
    <section class="intro">
      <p>&gt; SYSTEM READY...</p>
      <p>&gt; Welcome to the Gamer Den. Built by students (mostly).</p>
      <p style="color: rgba(0,0,0,.45); margin-top:10px;">_</p>
    </section>

    <div class="ads"></div>

    <div class="board" id="gamesBoard">
      <div class="empty">Downloading Games...</div>
    </div>
  </main>

  <!-- NEW: modal backdrop -->
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <!-- Glass Modal -->
  <div class="modal" id="gameWindow" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-toolbar">
      <div class="toolbar-left">
        <span class="toolbar-icon" id="windowIcon">👾</span>
        <div class="toolbar-text">
          <span class="toolbar-title" id="windowTitle">Game.exe</span>
          <span class="toolbar-sub" id="windowSubtitle"></span>
        </div>
      </div>
      <div class="toolbar-buttons">
        <button class="toolbar-button" id="restartGame" title="Restart">↺</button>
        <button class="toolbar-button" id="fullscreenGame" title="Max">[ ]</button>
        <button class="toolbar-button" id="closeGame" title="Close" style="font-weight:bold;">X</button>
      </div>
    </div>
    <div class="modal-content">
      <iframe id="gameFrame" title="Game window" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms"></iframe>
    </div>
  </div>

  <footer>
    <div>© 1999-2025 CentralSchool.fun <br>
      <marquee style="width: 240px; border: 1px solid rgba(0,0,0,.15); border-radius:999px; padding:6px; background: rgba(255,255,255,.55);">Made by Alex Rose</marquee>
    </div>
  </footer>

<script>
(function(){
  // ===== Bubbles =====
  const bubWrap = document.getElementById("bubbles");
  const bubbleCount = 20;
  for(let i=0;i<bubbleCount;i++){
    const b = document.createElement("div");
    b.className = "bubble";
    b.style.left = Math.random()*100 + "vw";
    b.style.animationDuration = (10 + Math.random()*10) + "s";
    b.style.animationDelay = (-Math.random()*12) + "s";
    b.style.opacity = (0.45 + Math.random()*0.45).toFixed(2);
    bubWrap.appendChild(b);
  }

  // ===== Ripple helper =====
  function addRipple(el, clientX, clientY){
    const r = document.createElement("span");
    r.className = "ripple";
    const rect = el.getBoundingClientRect();
    r.style.left = (clientX - rect.left) + "px";
    r.style.top  = (clientY - rect.top) + "px";
    el.appendChild(r);
    setTimeout(() => r.remove(), 650);
  }

  function sendToParent(message){
    try { window.parent.postMessage(message, "*"); }
    catch(e){ console.warn("postMessage failed:", e); }
  }

  // EXIT
  const exitBtn  = document.getElementById("exitApp");
  if (exitBtn) exitBtn.addEventListener("click", () => sendToParent("exit"));

  const backdrop = document.getElementById("backdrop");
  const modal = document.getElementById('gameWindow');
  const frame = document.getElementById('gameFrame');
  const windowIcon = document.getElementById('windowIcon');
  const windowTitle = document.getElementById('windowTitle');
  const windowSubtitle = document.getElementById('windowSubtitle');
  const restartBtn = document.getElementById('restartGame');
  const fullscreenBtn = document.getElementById('fullscreenGame');
  const closeBtn = document.getElementById('closeGame');

  const state = { games: [], map: new Map(), currentGame: null };
  let gameIsOpen = false;

  function onGameOpened(){
    if (gameIsOpen) return;
    gameIsOpen = true;
    sendToParent("start");
  }
  function onGameClosed(){
    if (!gameIsOpen) return;
    gameIsOpen = false;
    sendToParent("end");
  }

  function loadLauncher(game){
    const launcherUrl = new URL(game.launcher || 'game-launcher.html', window.location.href);
    launcherUrl.searchParams.set('id', game.id);
    frame.src = launcherUrl.toString();
  }

  function loadContent(game){
    if(!game) return;
    frame.src = encodeURI(game.content);
  }

  function openGame(gameId){
    const game = state.map.get(gameId);
    if(!game) return;

    state.currentGame = game;
    windowIcon.textContent = game.icon || '👾';
    windowTitle.textContent = (game.title || "Game") + ".EXE";
    windowSubtitle.textContent = game.subtitle || '';

    // show backdrop + modal (with zoom pop)
    backdrop.classList.add("show");
    backdrop.setAttribute("aria-hidden","false");

    modal.classList.add('show');
    modal.setAttribute('aria-hidden','false');

    onGameOpened();

    document.documentElement.style.overflow = "hidden";
    document.body.style.overflow = "hidden";

    loadLauncher(game);
  }

  function closeGame(){
    state.currentGame = null;

    modal.classList.remove('show');
    modal.setAttribute('aria-hidden','true');

    backdrop.classList.remove("show");
    backdrop.setAttribute("aria-hidden","true");

    if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    frame.src = 'about:blank';

    document.documentElement.style.overflow = "";
    document.body.style.overflow = "";

    onGameClosed();
  }

  if (restartBtn) restartBtn.addEventListener('click', () => {
    if(state.currentGame) loadLauncher(state.currentGame);
  });
  if (closeBtn) closeBtn.addEventListener('click', closeGame);

  if(backdrop){
    backdrop.addEventListener("click", closeGame);
  }

  if(fullscreenBtn){
    fullscreenBtn.addEventListener('click', () => {
      if(document.fullscreenElement){
        if(document.exitFullscreen) document.exitFullscreen();
      } else {
        if(frame.requestFullscreen) frame.requestFullscreen();
      }
    });
  }

  window.addEventListener('keydown', (event) => {
    if(event.key === 'Escape' && modal.classList.contains('show')) closeGame();
  });

  const modalObserver = new MutationObserver(() => {
    const visible = modal.classList.contains("show");
    if (visible) onGameOpened();
    else onGameClosed();
  });
  modalObserver.observe(modal, { attributes: true, attributeFilter: ["class"] });

  // Launcher -> open flow
  window.addEventListener('message', (event) => {
    if(!event.data || typeof event.data !== 'object') return;
    if(event.data.type === 'gamerden-launch'){
      const game = state.map.get(event.data.id);
      if(game) {
        if(!state.currentGame || state.currentGame.id !== game.id) openGame(game.id);
        loadContent(game);
      }
    }
  });

  const board = document.getElementById('gamesBoard');
  const ribbon = document.getElementById('newGamesRibbon');
  const ribbonSpan = ribbon ? ribbon.querySelector('span') : null;

  function buildRibbon(games){
    if(!ribbonSpan) return;
    const newOnes = games.filter(g => g.isNew);
    if(!newOnes.length){
      ribbonSpan.innerHTML = '*** ARCHIVE MODE *** ALL SYSTEMS NORMAL ***';
      return;
    }
    const marquee = newOnes.map(g => `>>> NEW: ${String(g.title||"").toUpperCase()} <<<`).join('   ');
    ribbonSpan.innerHTML = marquee + "   " + marquee;
  }

  function createCard(game){
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'ticket' + (game.isNew ? ' new' : '');
    card.dataset.id = game.id;

    card.innerHTML = `
      <div class="tt">
        <span class="icon">${game.icon || '💾'}</span>
        <span style="text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${game.title}</span>
      </div>
      <div class="desc">${game.description || ""}</div>
    `;

    card.addEventListener('pointerdown', (e) => {
      // Ripple on press
      addRipple(card, e.clientX, e.clientY);
    });

    card.addEventListener('click', () => openGame(game.id));
    return card;
  }

  fetch('https://www.centralschool.fun/gamerden-games.json')
    .then(res => res.ok ? res.json() : Promise.reject())
    .then(games => {
      state.games = games;
      games.forEach(game => state.map.set(game.id, game));
      buildRibbon(games);
      if (board) {
        board.innerHTML = '';
        games.forEach(game => board.appendChild(createCard(game)));
      }
    })
    .catch(() => {
      const demoGames = [
        {id:'1', title:'Error Fetching', isNew:true, icon:'🚀', description:'Could not load gamerden-games.json.'},
        {id:'2', title:'Offline Mode', isNew:false, icon:'🕹️', description:'Using fallback list.'},
      ];
      state.games = demoGames;
      demoGames.forEach(game => state.map.set(game.id, game));
      buildRibbon(demoGames);
      if (board) {
        board.innerHTML = '';
        demoGames.forEach(game => board.appendChild(createCard(game)));
      }
    });
})();
</script>

</body>
</html>
