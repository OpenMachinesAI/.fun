<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>CentralSchool.fun — PRO GAMER DEN</title>

  <!-- Retro Pixel Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000000;
      --neon-pink:#ff00ff;
      --neon-green:#00ff00;
      --neon-cyan:#00ffff;
      --neon-yellow:#ffff00;
      --win-gray:#c0c0c0;
      --win-blue:#000080;
      --font-head:"Press Start 2P", cursive;
      --font-body:"VT323", monospace;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--neon-green);
      font-family:var(--font-body);
      font-size:20px;
      background-color:var(--bg);
      background-image:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
        repeating-linear-gradient(0deg, transparent, transparent 19px, var(--neon-pink) 20px),
        repeating-linear-gradient(90deg, transparent, transparent 19px, var(--neon-cyan) 20px);
      background-size:40px 40px;
      animation:bgScroll 2s linear infinite;
      overflow-x:hidden;
      cursor:crosshair;
      overscroll-behavior-y:none;
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar{ width:16px; background:var(--win-gray); border-left:2px solid white; }
    ::-webkit-scrollbar-thumb{ background:var(--win-blue); border:2px outset #fff; }

    @keyframes bgScroll{ 0%{background-position:0 0;} 100%{background-position:40px 40px;} }

    .scanlines::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:999;
      background:repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.2) 3px,
        rgba(0,0,0,0.2) 4px
      );
      animation:flicker 0.15s infinite;
    }
    @keyframes flicker{ 0%{opacity:0.9;} 50%{opacity:1;} 100%{opacity:0.9;} }

    header{
      position:sticky;
      top:0;
      z-index:100;
      background:var(--win-gray);
      border-bottom:4px solid #000;
      box-shadow:0 4px 0 var(--neon-pink);
    }

    .bar{
      display:flex;
      align-items:center;
      gap:16px;
      padding:calc(12px + var(--safe-top)) calc(16px + var(--safe-right)) 12px calc(16px + var(--safe-left));
      background:linear-gradient(90deg,#000080,#008080);
      border:2px inset #fff;
      color:#fff;
      position:relative;
    }

    /* TOP-RIGHT app controls (sends messages to parent) */
    .app-controls{
      margin-left:auto;
      display:flex;
      gap:8px;
      align-items:center;
    }
    .app-btn{
      background:var(--win-gray);
      border:2px outset #fff;
      padding:6px 10px;
      font-family:var(--font-body);
      font-size:1.05rem;
      cursor:pointer;
      color:#000;
      white-space:nowrap;
      touch-action:manipulation;
    }
    .app-btn:active{ border-style: inset; }
    .app-btn.close{
      font-weight:900;
      background:#ffb3b3;
    }

    .mark{
      width:64px;
      height:52px;
      background:#000;
      border:2px solid var(--neon-yellow);
      position:relative;
      overflow:hidden;
      animation:spinLogo 4s infinite linear;
      flex:0 0 auto;
    }
    @keyframes spinLogo{ 0%{transform:rotateY(0deg);} 100%{transform:rotateY(360deg);} }
    .mark svg{ position:absolute; inset:0; filter:drop-shadow(2px 2px 0px red); }

    h1{
      margin:0;
      font-family:var(--font-head);
      font-size:1.5rem;
      color:var(--neon-yellow);
      text-shadow:4px 4px 0 #ff0000;
      text-transform:uppercase;
      line-height:1.5;
    }
    .sub{
      font-size:1rem;
      color:var(--neon-cyan);
      text-transform:uppercase;
      letter-spacing:2px;
      animation:blink 1s step-end infinite;
    }
    @keyframes blink{ 50%{opacity:0;} }

    .ribbon{
      background:var(--neon-pink);
      color:#fff;
      border-top:2px solid #fff;
      border-bottom:2px solid #000;
      font-family:var(--font-body);
      font-size:1.2rem;
      white-space:nowrap;
      overflow:hidden;
      padding:8px 0;
    }
    .ribbon span{
      display:inline-block;
      animation:marquee 10s linear infinite;
      padding-left:100%;
    }
    @keyframes marquee{ 0%{transform:translateX(0);} 100%{transform:translateX(-100%);} }
    .ribbon strong{
      background:var(--neon-yellow);
      color:#000;
      padding:2px 6px;
      box-shadow:2px 2px 0 #000;
    }

    main{
      padding:24px;
      max-width:1100px;
      margin:0 auto;
      position:relative;
      z-index:2;
      padding-bottom: calc(24px + var(--safe-bottom));
    }

    .intro{
      background:#000080;
      border:4px outset #fff;
      padding:16px;
      margin-bottom:24px;
      box-shadow:8px 8px 0 rgba(0,0,0,0.5);
    }
    .intro p{
      color:#fff;
      margin:0;
      font-size:1.2rem;
      line-height:1.4;
    }

    .ads{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
      gap:16px;
      margin-bottom:30px;
    }
    .ad{
      background:var(--neon-yellow);
      color:red;
      border:3px dashed red;
      padding:12px;
      font-family:var(--font-head);
      font-size:0.8rem;
      text-align:center;
      line-height:1.6;
      animation:pulse 0.5s infinite alternate;
      transform:rotate(-1deg);
    }
    @keyframes pulse{
      from{ transform:scale(1) rotate(-1deg); }
      to{ transform:scale(1.05) rotate(1deg); background:#fff; }
    }

    .board{
      display:grid;
      gap:24px;
      grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
      margin-bottom:30px;
    }

    .ticket{
      position:relative;
      background:var(--win-gray);
      border:3px outset #fff;
      padding:8px;
      display:flex;
      flex-direction:column;
      gap:8px;
      cursor:pointer;
      text-align:left;
      box-shadow:6px 6px 0 #000;
      transition:transform 0.1s, box-shadow 0.1s;
      overflow:visible;
      text-decoration:none;
    }
    .ticket:active{
      border-style:inset;
      transform:translate(2px,2px);
      box-shadow:4px 4px 0 #000;
    }
    .ticket:hover{ background:#dcdcdc; }
    .ticket:hover .tt{ color:blue; text-decoration:underline; }

    .ticket .tt{
      background:#000;
      color:var(--neon-green);
      padding:8px;
      border:2px inset #fff;
      display:flex;
      align-items:center;
      gap:12px;
      font-family:var(--font-head);
      font-size:0.7rem;
      line-height:1.4;
    }
    .ticket .icon{
      font-size:24px;
      filter:drop-shadow(2px 2px 0 var(--neon-pink));
    }
    .ticket .desc{
      color:#000;
      font-family:var(--font-body);
      font-size:1.1rem;
      padding:4px;
    }

    .ticket.new::before{
      content:"NEW!";
      position:absolute;
      top:-15px;
      right:-10px;
      background:red;
      color:yellow;
      border:2px solid white;
      padding:4px 8px;
      font-family:var(--font-head);
      font-size:0.7rem;
      transform:rotate(15deg);
      animation:rainbow-bg 0.5s infinite;
      box-shadow:3px 3px 0 #000;
      z-index:5;
    }
    @keyframes rainbow-bg{
      0%{ background:red; }
      33%{ background:blue; }
      66%{ background:lime; }
      100%{ background:red; }
    }

    .board .empty{
      grid-column:1 / -1;
      text-align:center;
      padding:40px;
      background:#000;
      border:4px double var(--neon-green);
      color:var(--neon-green);
      font-family:var(--font-head);
    }

    /* Modal Window */
    .modal{
      display:none;
      position:fixed;
      inset:5% 5%;
      background:var(--win-gray);
      border:3px outset #fff;
      box-shadow:20px 20px 0 rgba(0,0,0,0.7);
      z-index:2000;
      padding:2px;
      /* Resizable on desktop; clamp so it stays usable */
      resize: both;
      overflow: hidden;
      min-width: 320px;
      min-height: 260px;
      max-width: calc(100vw - 16px);
      max-height: calc(100vh - 16px);
    }
    .modal.show{ display:flex; flex-direction:column; }

    .modal-toolbar{
      background:var(--win-blue);
      color:#fff;
      padding:4px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
    }

    .toolbar-left{ display:flex; align-items:center; gap:8px; min-width: 0; }
    .toolbar-icon{ font-size:20px; }
    .toolbar-text{ display:flex; flex-direction:column; min-width:0; }
    .toolbar-title{
      font-family:var(--font-body);
      font-weight:bold;
      letter-spacing:1px;
      font-size:1.2rem;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 55vw;
    }
    .toolbar-sub{ display:none; }

    .toolbar-buttons{ display:flex; gap:4px; flex:0 0 auto; }

    .toolbar-button{
      background:var(--win-gray);
      border:2px outset #fff;
      padding:2px 6px;
      font-family:var(--font-body);
      font-size:1.1rem;
      cursor:pointer;
      color:#000;
      touch-action:manipulation;
    }
    .toolbar-button:active{ border-style:inset; }

    .modal-content{
      flex:1;
      border:2px inset #fff;
      background:#000;
      position:relative;
      margin-top:4px;
      min-height: 0; /* allow iframe to size within flex */
    }
    .modal-content iframe{
      width:100%;
      height:100%;
      border:none;
      display:block;
    }

    footer{
      text-align:center;
      padding:20px;
      background:#000;
      border-top:2px solid var(--neon-green);
      margin-top:40px;
      position:relative;
      z-index:10;
    }
    footer div{ color:var(--neon-green); font-size:1.2rem; }
    footer a{ color:var(--neon-pink); font-weight:bold; }
    button.ticket{ width:100%; }

    /* ===== Mobile responsiveness ===== */
    @media (max-width: 720px){
      body{ font-size: 18px; }
      main{ padding: 16px; }
      .bar{
        gap:12px;
        padding:calc(10px + var(--safe-top)) calc(12px + var(--safe-right)) 10px calc(12px + var(--safe-left));
      }
      h1{ font-size: 1.05rem; }
      .sub{ font-size: 0.9rem; }

      /* Modal becomes full-screen on mobile (no resize handle needed) */
      .modal{
        inset:0;
        border:none;
        box-shadow:none;
        resize:none;
        min-width: 0;
        min-height: 0;
        max-width: none;
        max-height: none;
      }
      .modal-toolbar{ padding: 8px; }
      .toolbar-title{ max-width: 55vw; }
    }
  </style>
</head>

<body class="scanlines">

  <header>
    <div class="bar">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 120 96" preserveAspectRatio="xMidYMid slice">
          <rect x="0" y="0" width="120" height="96" fill="#000080" />
          <path d="M10,80 L60,20 L110,80" fill="none" stroke="#00ff00" stroke-width="4"/>
          <rect x="50" y="50" width="20" height="20" fill="#ff00ff" />
        </svg>
      </div>

      <div style="min-width:0;">
        <h1>PRO GAMER DEN</h1>
        <div class="sub">Under Construction!!!</div>
      </div>

      <div class="app-controls">

        <button class="app-btn" 
        <button class="app-btn close" id="exitApp" title="Close">EXIT ✖</button>
      </div>
    </div>

    <div class="ribbon" id="newGamesRibbon">
      <span>*** WELCOME TO THE ZONE *** INSERT COIN *** LOADING...</span>
    </div>
  </header>

  <main>
    <section class="intro">
      <p>&gt; SYSTEM READY...</p>
      <p>&gt; Welcome to the Gamer Den. Built by students (mostly).</p>
      <p style="color: yellow; margin-top:10px; animation: blink 0.5s infinite;">_</p>
    </section>

    <div class="ads"></div>

    <div class="board" id="gamesBoard">
      <div class="empty">Downloading Games...</div>
    </div>
  </main>

  <!-- Windows 95 Modal -->
  <div class="modal" id="gameWindow" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-toolbar">
      <div class="toolbar-left">
        <span class="toolbar-icon" id="windowIcon">👾</span>
        <div class="toolbar-text">
          <span class="toolbar-title" id="windowTitle">Game.exe</span>
          <span class="toolbar-sub" id="windowSubtitle"></span>
        </div>
      </div>
      <div class="toolbar-buttons">
        <button class="toolbar-button" id="restartGame" title="Restart">↺</button>
        <button class="toolbar-button" id="fullscreenGame" title="Max">[ ]</button>
        <button class="toolbar-button" id="closeGame" title="Close" style="font-weight:bold;">X</button>
      </div>
    </div>
    <div class="modal-content">
      <iframe id="gameFrame" title="Game window" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms"></iframe>
    </div>
  </div>

  <footer>
    <div>© 1999-2025 CentralSchool.fun <br> <marquee style="width: 200px; border: 1px solid green;">Made by Alex Rose</marquee></div>
  </footer>

<!-- Drop-in changes: auto-send "start" when a game opens, "end" when it closes.
     (Also disables the manual START/END buttons so you don't need them.) -->

<script>
(function(){
  function sendToParent(message){
    try { window.parent.postMessage(message, "*"); }
    catch(e){ console.warn("postMessage failed:", e); }
  }

  // If you kept the buttons in the header, make them non-interactive (optional)
  const startBtn = document.getElementById("startAppMusic");
  const endBtn   = document.getElementById("endAppMusic");
  if (startBtn) { startBtn.disabled = true; startBtn.textContent = "START (AUTO)"; startBtn.style.opacity = "0.7"; }
  if (endBtn)   { endBtn.disabled = true;   endBtn.textContent   = "END (AUTO)";   endBtn.style.opacity   = "0.7"; }

  // Keep EXIT working
  const exitBtn  = document.getElementById("exitApp");
  if (exitBtn) exitBtn.addEventListener("click", () => sendToParent("exit"));

  // ===== Grab your existing functions/refs =====
  const modal = document.getElementById('gameWindow');
  const frame = document.getElementById('gameFrame');
  const windowIcon = document.getElementById('windowIcon');
  const windowTitle = document.getElementById('windowTitle');
  const windowSubtitle = document.getElementById('windowSubtitle');
  const restartBtn = document.getElementById('restartGame');
  const fullscreenBtn = document.getElementById('fullscreenGame');
  const closeBtn = document.getElementById('closeGame');

  const state = { games: [], map: new Map(), currentGame: null };

  // ===== IMPORTANT: only send start/end once per open/close =====
  let gameIsOpen = false;

  function onGameOpened(){
    if (gameIsOpen) return;
    gameIsOpen = true;
    sendToParent("start"); // parent fades OUT its music
  }
  function onGameClosed(){
    if (!gameIsOpen) return;
    gameIsOpen = false;
    sendToParent("end");   // parent fades IN its music
  }

  // ===== Your existing logic (same structure, just calls onGameOpened/Closed) =====
  function loadLauncher(game){
    const launcherUrl = new URL(game.launcher || 'game-launcher.html', window.location.href);
    launcherUrl.searchParams.set('id', game.id);
    frame.src = launcherUrl.toString();
  }

  function loadContent(game){
    if(!game) return;
    frame.src = encodeURI(game.content);
  }

  function openGame(gameId){
    const game = state.map.get(gameId);
    if(!game) return;

    state.currentGame = game;
    windowIcon.textContent = game.icon || '👾';
    windowTitle.textContent = game.title + ".EXE";
    windowSubtitle.textContent = game.subtitle || '';

    modal.classList.add('show');
    modal.setAttribute('aria-hidden','false');

    // ✅ AUTO START HERE
    onGameOpened();

    document.documentElement.style.overflow = "hidden";
    document.body.style.overflow = "hidden";

    loadLauncher(game);
  }

  function closeGame(){
    state.currentGame = null;

    modal.classList.remove('show');
    modal.setAttribute('aria-hidden','true');

    if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    frame.src = 'about:blank';

    document.documentElement.style.overflow = "";
    document.body.style.overflow = "";

    // ✅ AUTO END HERE
    onGameClosed();
  }

  // Bind existing buttons
  if (restartBtn) restartBtn.addEventListener('click', () => {
    if(state.currentGame) loadLauncher(state.currentGame);
  });
  if (closeBtn) closeBtn.addEventListener('click', closeGame);
  if(fullscreenBtn){
    fullscreenBtn.addEventListener('click', () => {
      if(document.fullscreenElement){
        if(document.exitFullscreen) document.exitFullscreen();
      } else {
        if(frame.requestFullscreen) frame.requestFullscreen();
      }
    });
  }

  window.addEventListener('keydown', (event) => {
    if(event.key === 'Escape' && modal.classList.contains('show')) closeGame();
  });

  // Optional safety: if anything else hides the modal, sync state
  const modalObserver = new MutationObserver(() => {
    const visible = modal.classList.contains("show");
    if (visible) onGameOpened();
    else onGameClosed();
  });
  modalObserver.observe(modal, { attributes: true, attributeFilter: ["class"] });

  // ===== keep your launcher -> open flow =====
  window.addEventListener('message', (event) => {
    if(!event.data || typeof event.data !== 'object') return;
    if(event.data.type === 'gamerden-launch'){
      const game = state.map.get(event.data.id);
      if(game) {
        if(!state.currentGame || state.currentGame.id !== game.id) openGame(game.id);
        loadContent(game);
      }
    }
  });

  // ===== Fetch games.json (same) =====
  const board = document.getElementById('gamesBoard');
  const ribbon = document.getElementById('newGamesRibbon');
  const ribbonSpan = ribbon ? ribbon.querySelector('span') : null;

  function buildRibbon(games){
    if(!ribbonSpan) return;
    const newOnes = games.filter(g => g.isNew);
    if(!newOnes.length){
      ribbonSpan.innerHTML = '*** ARCHIVE MODE *** ALL SYSTEMS NORMAL ***';
      return;
    }
    const marquee = newOnes.map(g => `>>> NEW: ${String(g.title||"").toUpperCase()} <<<`).join('   ');
    ribbonSpan.innerHTML = marquee + "   " + marquee;
  }

  function createCard(game){
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'ticket' + (game.isNew ? ' new' : '');
    card.dataset.id = game.id;
    const randomColor = ['#ff00ff', '#00ffff', '#00ff00', '#ffff00'][Math.floor(Math.random()*4)];
    card.innerHTML = `
      <div class="tt" style="border-color:${randomColor}">
        <span class="icon">${game.icon || '💾'}</span>
        <span style="text-transform:uppercase;">${game.title}</span>
      </div>
      <div class="desc">${game.description}</div>
    `;
    card.addEventListener('click', () => openGame(game.id));
    return card;
  }

  fetch('https://www.centralschool.fun/gamerden-games.json')
    .then(res => res.ok ? res.json() : Promise.reject())
    .then(games => {
      state.games = games;
      games.forEach(game => state.map.set(game.id, game));
      buildRibbon(games);
      if (board) {
        board.innerHTML = '';
        games.forEach(game => board.appendChild(createCard(game)));
      }
    })
    .catch(() => {
      const demoGames = [
        {id:'1', title:'Error Fetching', isNew:true, icon:'🚀', description:'error.'},
        {id:'2', title:'Error Fetching', isNew:false, icon:'🏓', description:'rip.'},
      ];
      state.games = demoGames;
      demoGames.forEach(game => state.map.set(game.id, game));
      buildRibbon(demoGames);
      if (board) {
        board.innerHTML = '';
        demoGames.forEach(game => board.appendChild(createCard(game)));
      }
    });
})();
</script>

</body>
</html>
