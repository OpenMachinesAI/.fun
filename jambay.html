<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JamBay.fun</title>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --hot-pink: #ff71ce;
            --cyan: #01cdfe;
            --yellow: #fffb96;
            --purple: #b967ff;
            --dark-blue: #050044;
            --glass: rgba(5, 0, 68, 0.7);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #050044 0%, #4b0082 50%, #ff71ce 100%);
            background-attachment: fixed;
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* CRT Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
            z-index: 100;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* Sidebar Player */
        .sidebar {
            width: 350px;
            background: var(--glass);
            border-right: 3px solid var(--hot-pink);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 10px 0 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .logo {
            font-family: 'Monoton', cursive;
            font-size: 2.2rem;
            color: var(--hot-pink);
            text-shadow: 2px 2px var(--cyan);
            text-align: center;
            margin-bottom: 30px;
        }

        .current-track-art {
            width: 100%;
            aspect-ratio: 1/1;
            border: 2px solid var(--cyan);
            box-shadow: 0 0 15px var(--cyan);
            object-fit: cover;
            margin-bottom: 20px;
        }

        .track-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .track-info h2 {
            font-size: 1.2rem;
            color: var(--yellow);
            margin: 0;
            font-family: 'VT323', monospace;
            letter-spacing: 2px;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .ctrl-btn {
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 10px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
        }

        .ctrl-btn:hover {
            background: var(--cyan);
            color: var(--dark-blue);
            box-shadow: 0 0 10px var(--cyan);
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #000;
            border: 1px solid var(--purple);
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--hot-pink);
            box-shadow: 0 0 10px var(--hot-pink);
        }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px;
            background: rgba(0, 0, 0, 0.2);
        }

        .search-container {
            margin-bottom: 40px;
            width: 100%;
        }

        #search-bar {
            width: 100%;
            background: transparent;
            border: 2px solid var(--purple);
            padding: 15px;
            color: var(--white);
            font-family: 'Orbitron', sans-serif;
            color: var(--cyan);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        #search-bar:focus {
            box-shadow: 0 0 20px var(--purple);
            border-color: var(--hot-pink);
        }

        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
        }

        .album-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border: 1px solid transparent;
            transition: 0.3s;
            cursor: pointer;
            text-align: center;
        }

        .album-card:hover {
            border-color: var(--hot-pink);
            transform: translateY(-5px);
            background: rgba(255, 113, 206, 0.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .album-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .album-card span {
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            color: var(--cyan);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark-blue); }
        ::-webkit-scrollbar-thumb { background: var(--purple); }
        ::-webkit-scrollbar-thumb:hover { background: var(--hot-pink); }

    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">ＪＡＭＢＡＹ</div>
        
        <img id="current-art" class="current-track-art" src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?w=500" alt="Art">
        
        <div class="track-info">
            <h2 id="current-title">Select a Track</h2>
        </div>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" onclick="prevTrack()">≪ PREV</button>
            <button class="ctrl-btn" id="play-btn" onclick="togglePlay()">PLAY ▶</button>
            <button class="ctrl-btn" onclick="nextTrack()">NEXT ≫</button>
        </div>

        <div style="font-family: 'VT323'; font-size: 0.9rem; color: var(--purple); text-align: center; margin-top: auto;">
            SYSTEM STATUS: ONLINE<br>
            BUFFERING NOSTALGIA...
        </div>
    </aside>

    <main class="main-content">
        <div class="search-container">
            <input type="text" id="search-bar" placeholder="SEARCH THE VIRTUAL PLAZA..." onkeyup="filterSongs()">
        </div>

        <div class="album-grid" id="album-grid">
            <!-- Albums injected here -->
        </div>
    </main>

    <audio id="audio-player"></audio>

    <script>
const songData = [
  {
    id: 0,
    name: "Cole VanDePoll",
    url: "https://www.centralschool.fun/tracklist/Cole%20VanDePoll.mp3",
    art: "https://www.centralschool.fun/tracklist/not_a_chatgpt_image.png"
  },
  {
    id: 1,
    name: "Cookin Fries",
    url: "https://www.centralschool.fun/tracklist/Cookin%20Fries.mp3",
    art: "https://www.centralschool.fun/tracklist/not_a_chatgpt_image.png"
  },
  {
    id: 2,
    name: "Mr Carson Golf",
    url: "https://www.centralschool.fun/tracklist/Mr%20Carson%20Golf.mp3",
    art: "https://www.centralschool.fun/tracklist/not_a_chatgpt_image.png"
  },
  {
    id: 3,
    name: "Mr Golder RAP",
    url: "https://www.centralschool.fun/tracklist/Mr%20Golder%20RAP.mp3",
    art: "https://www.centralschool.fun/tracklist/not_a_chatgpt_image.png"
  },
  {
    id: 4,
    name: "Mr Good — Got the Goods",
    url: "https://www.centralschool.fun/tracklist/Mr%20Good--%20Got%20the%20goods.mp3",
    art: "https://www.centralschool.fun/tracklist/not_a_chatgpt_image.png"
  },
  {
    id: 5,
    name: "Ms. Pierik",
    url: "https://www.centralschool.fun/tracklist/Ms.%20Pierik.mp3",
    art: "https://www.centralschool.fun/tracklist/not_a_chatgpt_image.png"
  },
  {
    id: 6,
    name: "Outdoor ED",
    url: "https://www.centralschool.fun/tracklist/Outdoor%20ED.mp3",
    art: "https://www.centralschool.fun/tracklist/not_a_chatgpt_image.png"
  },
  {
    id: 7,
    name: "Sam Is…..",
    url: "https://www.centralschool.fun/tracklist/Sam%20is.....mp3",
    art: "https://www.centralschool.fun/tracklist/not_a_chatgpt_image.png"
  },
  {
    id: 8,
    name: "Where Is Mr Shortreed",
    url: "https://www.centralschool.fun/tracklist/Where%20is%20Mr%20Shortreed.mp3",
    art: "https://www.centralschool.fun/tracklist/not_a_chatgpt_image.png"
  },
  {
    id: 9,
    name: "Who’s the Man — Mr. Shortreed!",
    url: "https://www.centralschool.fun/tracklist/Who%E2%80%99s%20the%20man_%20%E2%80%94%20Mr.%20Shortreed!.mp3",
    art: "https://www.centralschool.fun/tracklist/not_a_chatgpt_image.png"
  }
];


        let currentTrackIndex = 0;
        let isPlaying = false;
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const progress = document.getElementById('progress');

        // Render the Grid
        function renderAlbums(songs) {
            const grid = document.getElementById('album-grid');
            grid.innerHTML = '';
            songs.forEach(song => {
                const card = document.createElement('div');
                card.className = 'album-card';
                card.onclick = () => loadTrack(song.id);
                card.innerHTML = `
                    <img src="${song.art}" alt="${song.name}">
                    <span>${song.name}</span>
                `;
                grid.appendChild(card);
            });
        }

        // Search functionality
        function filterSongs() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const filtered = songData.filter(s => s.name.toLowerCase().includes(query));
            renderAlbums(filtered);
        }

        // Player Logic
        function loadTrack(index) {
            currentTrackIndex = index;
            const track = songData[index];
            audio.src = track.url;
            document.getElementById('current-art').src = track.art;
            document.getElementById('current-title').innerText = track.name;
            
            audio.play();
            isPlaying = true;
            playBtn.innerText = "PAUSE ||";
        }

        function togglePlay() {
            if (!audio.src) return;
            if (isPlaying) {
                audio.pause();
                playBtn.innerText = "PLAY ▶";
            } else {
                audio.play();
                playBtn.innerText = "PAUSE ||";
            }
            isPlaying = !isPlaying;
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % songData.length;
            loadTrack(currentTrackIndex);
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + songData.length) % songData.length;
            loadTrack(currentTrackIndex);
        }

        // Progress Bar update
        audio.addEventListener('timeupdate', () => {
            const pct = (audio.currentTime / audio.duration) * 100;
            progress.style.width = pct + '%';
        });

        // Seek
        document.getElementById('progress-container').addEventListener('click', (e) => {
            const width = e.target.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        });

        audio.addEventListener('ended', nextTrack);

        // Init
        renderAlbums(songData);
    </script>
</body>
</html>
