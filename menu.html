<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Arcade</title>
  <style>
    :root { --cyan: #00ffff; }
    body {
      margin: 0; overflow: hidden; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #00111a; color: #fff; font-family: Arial, sans-serif; perspective: 1600px;
    }
    header {
      position: absolute; top: 20px; text-align: center; z-index: 5;
      padding: 10px 20px; border-radius: 16px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(10px) saturate(120%); box-shadow: 0 6px 18px rgba(0,255,255,0.2);
    }
    header h1 { margin: 0; font-size: 2.2rem; color: var(--cyan); text-shadow: 0 0 14px var(--cyan); }
    header p { margin: 2px 0 0; color: #cfe8eb; font-size: 0.9rem; }
    .game-container {
      display: flex; justify-content: center; align-items: center; gap: 48px; z-index: 3;
    }
    .game {
      width: 170px; height: 300px; border-radius: 18px;
      background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(10px) saturate(120%);
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      transform-style: preserve-3d; transition: transform .6s cubic-bezier(.25,.8,.25,1), box-shadow .6s, border-color .6s;
    }
    .game img { width: 90%; height: 80%; object-fit: cover; border-radius: 14px; margin-top: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.35); }
    .title { font-size: 1rem; margin-top: 8px; color: #e8feff; }
    .selected {
      transform: scale(1.4) translateY(-20px) rotateY(10deg);
      border-color: var(--cyan); box-shadow: 0 0 40px var(--cyan), 0 20px 60px rgba(0,255,255,0.6);
    }
    .status-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      padding: 20px 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,.45);
      background: rgba(0,0,0,.65); backdrop-filter: blur(12px) saturate(140%);
      text-align: center; font-size: 1.15rem; display: none; z-index: 50; color: #fff;
    }
    .overlay { position: fixed; inset: 0; display: none; z-index: 30; background: #000; align-items: center; justify-content: center; }
    .overlay iframe { width: 100%; height: 100%; border: none; background: #000; }
    .tooltip { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      font-size: 1.05rem; color: var(--cyan); padding: 10px 18px; border-radius: 10px;
      background: rgba(0,0,0,.45); border: 1px solid var(--cyan); backdrop-filter: blur(8px);
      animation: fadeOut 1s ease 5s forwards; pointer-events: none; }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
  </style>
</head>
<body>
  <header>
    <h1>Student Arcade</h1>
    <p>Designed By Central Students</p>
  </header>

  <div class="game-container" id="games"></div>

  <!-- Fullscreen game overlay -->
  <div class="overlay" id="overlay">
    <iframe id="gameframe"></iframe>
    <div class="tooltip">Hold X for 2 seconds to exit</div>
  </div>

  <div id="statusPrompt" class="status-box"></div>

  <audio id="sndSelect" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>

  <script>
    let games = [];
    let selectedIndex = 0;
    let axisCooldown = 0;
    let inGame = false;
    let exitHoldFrames = 0;
    let prevButtons = [];

    const elContainer = document.getElementById('games');
    const elOverlay = document.getElementById('overlay');
    const elFrame = document.getElementById('gameframe');
    const elStatus = document.getElementById('statusPrompt');
    const sndSelect = document.getElementById('sndSelect');

    function play(a){ try{ a.currentTime=0; a.play(); }catch(e){} }
    function axisVal(v){ return v < -0.5 ? -1 : (v > 0.5 ? 1 : 0); }
    function pressedOnce(gp,i){ const now=!!gp.buttons[i]?.pressed,was=!!prevButtons[i]; prevButtons[i]=now; return now&&!was; }

    function renderGames(){
      elContainer.innerHTML = '';
      games.forEach((g,i)=>{
        const card = document.createElement('div');
        card.className = 'game' + (i===selectedIndex ? ' selected' : '');
        card.innerHTML = `<img src="${g.icon}" alt="${g.name}"><div class="title">${g.name}</div>`;
        elContainer.appendChild(card);
      });
    }
    function moveSelection(dir){
      selectedIndex = (selectedIndex + dir + games.length) % games.length;
      renderGames(); play(sndSelect);
    }
    function startGame(){
      inGame = true; elOverlay.style.display='flex';
      elFrame.src = games[selectedIndex].url;
    }
    function closeGame(){
      inGame = false; elOverlay.style.display='none'; elFrame.src='';
    }

    function showPrompt(msg){ elStatus.textContent = msg; elStatus.style.display='block'; }
    function hidePrompt(){ elStatus.style.display='none'; }

    function pollGamepad(){
      const gp = (navigator.getGamepads && navigator.getGamepads()[0]) || null;
      if(gp){
        const ax0 = gp.axes[0]||0, ax2 = gp.axes[2]||0;
        const moveX = axisVal(Math.abs(ax0)>Math.abs(ax2)?ax0:ax2);
        if(axisCooldown<=0 && !inGame){
          if(moveX===-1){moveSelection(-1);axisCooldown=14;}
          else if(moveX===1){moveSelection(1);axisCooldown=14;}
        } else axisCooldown--;
        if(pressedOnce(gp,0) && !inGame){ startGame(); } // A
        if(inGame){
          if(gp.buttons[2]?.pressed){ // X
            exitHoldFrames++;
            if(exitHoldFrames>120){ exitHoldFrames=0; closeGame(); }
          } else exitHoldFrames=0;
        }
      }
      requestAnimationFrame(pollGamepad);
    }
    window.addEventListener('gamepadconnected', pollGamepad);

    // Load games.json
    fetch('games.json')
      .then(res=>res.json())
      .then(data=>{
        games=data;
        renderGames();
      })
      .catch(err=>showPrompt("⚠️ Could not load games.json"));
  </script>
</body>
</html>
