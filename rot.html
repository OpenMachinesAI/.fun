<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brainrot Picker (Safe)</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1b1f4a, #0f1220);
    color: #f4f4ff;
    font-family: system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .app {
    background: #171a2e;
    padding: 24px;
    border-radius: 18px;
    max-width: 650px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,.35);
  }

  h1 {
    text-align: center;
    margin-bottom: 16px;
  }

  .letters {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
    gap: 8px;
    margin-bottom: 20px;
  }

  .letter {
    border: 1px solid #2d3270;
    background: transparent;
    color: #9aa0ff;
    padding: 10px 0;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
  }

  .letter:hover {
    background: #7c7cff;
    color: white;
  }

  .result {
    background: #10132a;
    border-radius: 14px;
    padding: 24px;
    min-height: 120px;
    text-align: center;
  }

  .term {
    font-size: 1.8rem;
    color: #7c7cff;
    margin-bottom: 12px;
    font-weight: 700;
  }

  .info-btn {
    border: 1px solid #7c7cff;
    background: transparent;
    color: #7c7cff;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }

  .info-btn:hover {
    background: #7c7cff;
    color: white;
  }

  .definition {
    margin-top: 14px;
    font-size: 0.95rem;
    line-height: 1.4;
  }

  .hint {
    text-align: center;
    opacity: 0.7;
    margin-top: 12px;
    font-size: 0.85rem;
  }
</style>
</head>

<body>
<div class="app">
  <h1>🧠 Brainrot Picker (Safe)</h1>
  <div class="letters" id="letters"></div>
  <div class="result" id="result">Pick a letter</div>
  <div class="hint">Guess first, then reveal the meaning</div>
</div>

const lettersEl=document.getElementById("letters");
const resultEl=document.getElementById("result");

Object.keys(brainrot).forEach(letter=>{
 const b=document.createElement("button");
 b.className="letter";
 b.textContent=letter;
 b.onclick=()=>{
  const pick=brainrot[letter][Math.floor(Math.random()*brainrot[letter].length)];
  resultEl.innerHTML=`<div class="term">${pick.term}</div><button class="info-btn">ℹ️ What does this mean?</button>`;
  resultEl.querySelector(".info-btn").onclick=()=>{
    resultEl.innerHTML+=`<div class="definition">${pick.def}</div>`;
    resultEl.querySelector(".info-btn").remove();
  };
 };
 lettersEl.appendChild(b);
});
</script>
</body>
</html>
