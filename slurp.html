<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📬 Email-Slurper: Slurps up Emails</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(45deg, #000, #101010);
      color: #39ff14;
      padding: 2rem;
      background-image: url('https://www.transparenttextures.com/patterns/black-linen.png');
    }
    h1 {
      font-size: 2rem;
      color: #00ffff;
      text-shadow: 2px 2px #00ff00;
    }
    .email {
      margin: 1rem 0;
      border: 2px dashed #39ff14;
      padding: 1rem;
      background-color: rgba(0, 0, 0, 0.85);
      cursor: pointer;
    }
    .preview {
      border: 2px solid #00ffff;
      background-color: #000;
      padding: 1rem;
      margin-top: 1rem;
    }
    #email-address {
      font-weight: bold;
      font-size: 1.2rem;
      color: #ffffff;
    }
    #copy-btn {
      background: #222;
      border: 1px solid #00ffff;
      color: #00ffff;
      font-family: inherit;
      padding: 0.5rem 1rem;
      margin-left: 1rem;
      cursor: pointer;
    }
    #copy-btn:hover {
      background: #00ffff;
      color: #000;
    }
  </style>
</head>
<body>
  <h1>📩 Email-Slurper</h1>
  <p>
    <strong>Your Custom Email Slurpy:</strong>
    <span id="email-address">Loading...</span>
    <button id="copy-btn">Copy</button>
  </p>
  <div id="emails"></div>
  <div id="preview" class="preview"></div>

  <script type="module">
    import { MailSlurp } from "https://cdn.skypack.dev/mailslurp-client";

    const apiKey = 'b0256101b5a001989657e2948477e5a96271540a1fd85465890cb8a766c06ad9';
    const mailslurp = new MailSlurp({ apiKey });

    let inbox;

    async function createInbox() {
      try {
        inbox = await mailslurp.createInboxWithOptions({
          name: "SpamInhailer",
          description: "Catch all the spam, baby!"
        });
        document.getElementById('email-address').textContent = inbox.emailAddress;
        setupCopyButton(inbox.emailAddress);
        pollEmails();
      } catch (e) {
        console.error('Failed to create inbox:', e);
      }
    }

    function setupCopyButton(email) {
      document.getElementById('copy-btn').onclick = () => {
        navigator.clipboard.writeText(email).then(() => {
          document.getElementById('copy-btn').textContent = 'Copied!';
          setTimeout(() => {
            document.getElementById('copy-btn').textContent = 'Copy';
          }, 1500);
        });
      };
    }

    async function pollEmails() {
      try {
        const emails = await mailslurp.getEmails(inbox.id);
        const container = document.getElementById('emails');
        container.innerHTML = '';
        emails.forEach(email => {
          const div = document.createElement('div');
          div.className = 'email';
          div.innerHTML = `
            <strong>From:</strong> ${email.from}<br>
            <strong>Subject:</strong> ${email.subject}<br>
            <em>(Click to preview)</em>
          `;
          div.onclick = () => showEmail(email.id);
          container.appendChild(div);
        });
      } catch (e) {
        console.error('Failed to load emails:', e);
      }
      setTimeout(pollEmails, 10000);
    }

    async function showEmail(emailId) {
      try {
        const email = await mailslurp.emailController.getEmail({ emailId });
        const preview = document.getElementById('preview');
        preview.innerHTML = `<h3>${email.subject}</h3><div>${email.bodyHTML || email.body || '(No content)'}</div>`;
      } catch (e) {
        console.error('Failed to load email content:', e);
      }
    }

    createInbox();
  </script>
</body>
</html>
