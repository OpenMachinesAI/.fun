<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CCP - Central Content Pool</title>
  <style>
    body {
      background-color: #ffcc00;
      font-family: "Comic Sans MS", cursive, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #003399;
      color: white;
      padding: 15px;
      font-size: 2em;
      border-bottom: 4px double #fff;
    }
    .logo {
      font-size: 50px;
      font-weight: bold;
      color: #ff0000;
      text-shadow: 3px 3px 0 #000;
      margin-top: 20px;
    }
    .subtext {
      font-size: 24px;
      color: black;
      margin-top: -10px;
    }
    .fineprint {
      font-size: 12px;
      color: gray;
      margin-top: -5px;
      font-style: italic;
    }
    .container {
      margin: 20px auto;
      width: 90%;
      max-width: 1200px;
    }
    /* Search Bar */
    .search-container {
      margin: 20px auto;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    #search-input {
      width: 80%;
      padding: 10px;
      font-size: 18px;
      border: 3px solid #000;
      outline: none;
      background: #ffffff;
      transition: 0.3s ease-in-out;
    }
    #search-input:focus {
      background: #ffff99;
    }
    /* Videos Grid */
    .videos {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }
    .video-card {
      background-color: #fff;
      border: 3px solid black;
      padding: 10px;
      width: 320px;
      cursor: pointer;
      transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
      animation: fadeIn 0.5s ease-in;
    }
    .video-card:hover {
      transform: scale(1.05);
      box-shadow: 5px 5px 0 #000;
    }
    .video-card img {
      width: 100%;
      height: auto;
      aspect-ratio: 16/9;
      object-fit: cover;
      border: 4px solid black;
      image-rendering: pixelated;
    }
    .video-card h2 {
      margin: 10px 0 0 0;
      font-size: 20px;
      color: #003399;
    }
    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.5s;
    }
    .modal-window {
      background-color: #c0c0c0;
      border: 2px solid #000;
      width: 80%;
      max-width: 800px;
      box-shadow: 5px 5px 0 #000;
      animation: slideDown 0.5s ease-out;
    }
    .modal-header {
      background: #000080;
      color: white;
      padding: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header button {
      background: #c0c0c0;
      border: 2px outset #fff;
      cursor: pointer;
      margin-left: 5px;
    }
    .modal-content {
      padding: 10px;
      background: #fff;
    }
    .modal-content video {
      width: 100%;
      height: auto;
      max-height: 80vh;
      object-fit: contain;
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <header>Welcome to CCP</header>
  <div class="logo">CCP</div>
  <div class="subtext">(Central Content Pool)</div>
  <div class="fineprint">(not the China guys, they copied us...)</div>

  <div class="container">
    <!-- Search Bar -->
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search for videos...">
    </div>

    <div class="videos" id="video-list"></div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-window">
      <div class="modal-header">
        <span id="modal-title">Video Player</span>
        <div>
          <button id="fullscreen-btn">Full Screen</button>
          <button id="close-btn">Close</button>
        </div>
      </div>
      <div class="modal-content">
        <video id="modal-video" controls>
          <source id="video-source" src="" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
  </div>

  <script>
    let allVideos = [];
    const videoList = document.getElementById('video-list');
    const searchInput = document.getElementById('search-input');

    // Fetch video data and store in allVideos
    async function fetchVideos() {
      try {
        const response = await fetch('https://salexai-funserver.hf.space/album/B0p532ODWH4KDMb');
        const data = await response.json();
        allVideos = data.videos;
        renderVideos(allVideos);
      } catch (error) {
        console.error('Failed to fetch videos:', error);
      }
    }

    // Render videos after search filtering
    async function renderVideos(videoArray) {
      // Clear current list
      videoList.innerHTML = '';

      for (const vid of videoArray) {
        const title = vid.caption && vid.caption.trim() ? vid.caption.trim() : 'Unnamed Video';
        // Use the new poster field
        const thumb = vid.poster && vid.poster.trim() ? vid.poster : 'https://via.placeholder.com/320x180.png?text=No+Preview';

        // Build card
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <img src="${thumb}" alt="Thumbnail">
          <h2>${title}</h2>
        `;
        card.addEventListener('click', () => openModal(title, vid.url));
        videoList.appendChild(card);
      }
    }

    // Simple search by caption text
    searchInput.addEventListener('input', (e) => {
      const searchVal = e.target.value.toLowerCase();
      const filtered = allVideos.filter(v => {
        // If no caption, we used 'Unnamed Video' so let's unify that.
        const cap = v.caption && v.caption.trim() ? v.caption.trim().toLowerCase() : 'unnamed video';
        return cap.includes(searchVal);
      });
      renderVideos(filtered);
    });

    // Open modal
    function openModal(title, url) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('video-source').src = url;
      const modalVideo = document.getElementById('modal-video');
      modalVideo.load();
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    // Close modal
    document.getElementById('close-btn').addEventListener('click', () => {
      const modalVideo = document.getElementById('modal-video');
      modalVideo.pause();
      document.getElementById('modal-overlay').style.display = 'none';
    });

    // Fullscreen
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      const modalVideo = document.getElementById('modal-video');
      if (modalVideo.requestFullscreen) {
        modalVideo.requestFullscreen();
      } else if (modalVideo.webkitRequestFullscreen) {
        modalVideo.webkitRequestFullscreen();
      } else if (modalVideo.msRequestFullscreen) {
        modalVideo.msRequestFullscreen();
      }
    });

    fetchVideos();
  </script>
</body>
</html>
